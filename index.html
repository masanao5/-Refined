      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0)
              .map((line, i) => {
                  let q = '';
                  let a = '';
                  if (line.includes('\t')) {
                      const parts = line.split('\t');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else if (line.includes(',')) {
                      const parts = line.split(',');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else {
                      const match = line.match(/^(.+?)[\s　]+(.+)$/);
                      if (match) {
                          q = match[1].trim();
                          a = match[2].trim();
                      } else {
                          q = line.trim();
                          a = '？';
                      }
                  }
                  return { id: i + 1, q, a, w: 100, ok: false, star: false };
              });
      }

          const [loginLoading, setLoginLoading] = useState(false);

          const [settings, setSettings] = useState({ 
              darkMode: DEFAULT_DARK_MODE, 
              autoSpeak: DEFAULT_AUTO_SPEAK, 
              rateIndex: DEFAULT_SPEECH_RATE, 
              fontSizeQIndex: DEFAULT_FONT_SIZE_Q, 
              fontSizeAIndex: DEFAULT_FONT_SIZE_A, 
              reverseMode: DEFAULT_REVERSE_MODE,
              showCanvas: DEFAULT_SHOW_CANVAS,
              showSpeakButton: DEFAULT_SHOW_SPEAK_BUTTON,
              enableDictation: DEFAULT_ENABLE_DICTATION,
              enableKeyboardSpeak: DEFAULT_ENABLE_KEYBOARD_SPEAK,
              enableInput: DEFAULT_ENABLE_INPUT,
              canvasPosition: DEFAULT_CANVAS_POSITION,
              displayScale: DEFAULT_DISPLAY_SCALE,
              leaderboardName: DEFAULT_LEADERBOARD_NAME
          });

          const [presets, setPresets] = useState([]);
          const [presetName, setPresetName] = useState('');
          const [showPresetSave, setShowPresetSave] = useState(false);

          const [isListening, setIsListening] = useState(false);
          const [dictationResult, setDictationResult] = useState('');
          const recognitionRef = useRef(null);

          const [inputValue, setInputValue] = useState('');
          const [inputResult, setInputResult] = useState(null);
          const inputRef = useRef(null);

          const [modals, setModals] = useState({ menu: false, list: false, edit: false, leaderboard: false });
          const [activeTab, setActiveTab] = useState('study'); 
          const [tempRawText, setTempRawText] = useState(rawText);
          const [toast, setToast] = useState({ message: '', visible: false });
          const [listFilter, setListFilter] = useState('all');

          // リーダーボード用 state
          const [leaderboardType, setLeaderboardType] = useState('today'); // 'today' | 'total' | 'time'
          const [rankings, setRankings] = useState([]);
          const [rankingsLoading, setRankingsLoading] = useState(false);

          // キャンバス操作 Ref
          const canvasRef = useRef(null);
          const canvasRightRef = useRef(null);
          const isDrawing = useRef(false);
          const lastX = useRef(0);
          const lastY = useRef(0);
          const lastTime = useRef(0);
          const currentStrokeWidth = useRef(4.0);
          const activeCanvasRef = useRef(null);

          const currentItemDetail = useMemo(() => {
              if (!currentItem) return null;
              return items.find(i => i.q === currentItem.q) || currentItem;
          }, [items, currentItem]);

          const activeItems = useMemo(() => {
              if (activeMode === 'star') return items.filter(i => i.star);
              if (activeMode === 'ng') return items.filter(i => !i.ok);
              if (activeMode === 'ok') return items.filter(i => i.ok);
              return items;
          }, [items, activeMode]);

          // --- 統合APIリクエスト関数（Chromebook学校GAS ⇄ 個人GAS自動判定 & CORS対策） ---
          const sendApiRequest = useCallback(async (payload) => {
              // 1. Chromebook環境（学校GAS内蔵実行）
              if (typeof google !== 'undefined' && google.script && google.script.run) {
                  return new Promise((resolve, reject) => {
                      google.script.run
                          .withSuccessHandler(res => {
                              try { resolve(typeof res === 'string' ? JSON.parse(res) : res); }
                              catch(e) { resolve({ status: 'success', raw: res }); }
                          })
                          .withFailureHandler(err => reject(err))
                          .relayToPersonalGAS(payload);
                  });
              }

              // 2. スマホ・GitHub Pages環境（CORS対策：text/plain 送信）
              if (!PERSONAL_GAS_URL) {
                  return { status: 'error', message: 'API URLが未設定です' };
              }

              try {
                  const res = await fetch(PERSONAL_GAS_URL, {
                      method: 'POST',
                      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                      body: JSON.stringify(payload)
                  });
                  return await res.json();
              } catch (e) {
                  console.warn("API通信エラー:", e);
                  return { status: 'error', message: e.message };
              }
          }, []);

          // 学習時間・マスター数の計算
          const getStudySeconds = () => {
              const start = localStorage.getItem(LEADERBOARD_SESSION_START);
              if (!start) {
                  localStorage.setItem(LEADERBOARD_SESSION_START, Date.now());
                  return 0;
              }
              return Math.floor((Date.now() - parseInt(start)) / 1000);
          };

          const getLeaderboardStats = () => {
              try {
                  return JSON.parse(localStorage.getItem(LEADERBOARD_STATS_KEY)) || { todayDate: '', todayCount: 0, totalMastered: 0 };
              } catch(e) { return { todayDate: '', todayCount: 0, totalMastered: 0 }; }
          };

          const updateLeaderboardStats = (newlyMastered) => {
              if (newlyMastered <= 0) return;
              const stats = getLeaderboardStats();
              const today = new Date().toISOString().slice(0, 10);
              if (stats.todayDate !== today) {
                  stats.todayDate = today;
                  stats.todayCount = newlyMastered;
              } else {
                  stats.todayCount += newlyMastered;
              }
              stats.totalMastered = (stats.totalMastered || 0) + newlyMastered;
              try { localStorage.setItem(LEADERBOARD_STATS_KEY, JSON.stringify(stats)); } catch(e) {}
          };

          // ★ 遅延対策：バルク送信（1問ごとには送信せず、まとめて同期）
          const syncStudyData = useCallback(async () => {
              if (!authUser) return;
              const stats = getLeaderboardStats();
              const payload = {
                  action: 'log',
                  classNum: authUser.classNum,
                  studentNum: authUser.studentNum,
                  userName: authUser.name,
                  studySeconds: getStudySeconds(),
                  masteredToday: stats.todayCount || 0,
                  totalMastered: stats.totalMastered || 0,
                  appTitle: appTitle
              };
              try {
                  await sendApiRequest(payload);
              } catch(e) {}
          }, [authUser, sendApiRequest]);

          // ランキング取得
          const fetchRankings = useCallback(async (type = leaderboardType) => {
              setRankingsLoading(true);
              setLeaderboardType(type);
              try {
                  // 同期してからランキング取得
                  if (authUser) await syncStudyData();
                  const res = await sendApiRequest({ action: 'ranking', type: type, appTitle: appTitle });
                  if (res && res.rankings) {
                      setRankings(res.rankings);
                  }
              } catch(e) {
                  showToast("ランキング取得に失敗しました");
              } finally {
                  setRankingsLoading(false);
              }
          }, [authUser, leaderboardType, sendApiRequest, syncStudyData]);

          // 生徒ログイン認証（4桁PINによるなりすまし防止）
          const handleLogin = async (e) => {
              if (e) e.preventDefault();
              if (!loginClassNum || !loginStudentNum || !loginPin) {
                  showToast("組、番号、暗証番号(4桁)を入力してください");
                  return;
              }
              if (loginPin.length !== 4) {
                  showToast("暗証番号は4桁で入力してください");
                  return;
              }
              setLoginLoading(true);

              try {
                  const res = await sendApiRequest({
                      action: 'auth',
                      classNum: String(loginClassNum).trim(),
                      studentNum: String(loginStudentNum).trim(),
                      pin: String(loginPin).trim()
                  });

                  if (res && res.status === 'success' && res.name) {
                      const userObj = {
                          classNum: loginClassNum,
                          studentNum: loginStudentNum,
                          name: res.name
                      };
                      setAuthUser(userObj);
                      localStorage.setItem(AUTH_USER_KEY, JSON.stringify(userObj));
                      showToast(`${res.name} さん、ログインしました！`);
                      setLoginPin('');
                      fetchRankings(leaderboardType);
                  } else {
                      showToast(res.message || "組・番号または暗証番号が違います");
                  }
              } catch(err) {
                  showToast("通信エラーが発生しました");
              } finally {
                  setLoginLoading(false);
              }
          };

          const handleLogout = () => {
              if (window.confirm("ログアウトしますか？")) {
                  try { localStorage.removeItem(AUTH_USER_KEY); } catch(e) {}
                  setAuthUser(null);
                  showToast("ログアウトしました");
              }
          };

          // プリセット読み込み
          useEffect(() => {
              try {
                  const saved = localStorage.getItem(PRESETS_KEY);
                  if (saved) {
                      setPresets(JSON.parse(saved));
                  } else {
                      setPresets(DEFAULT_PRESETS);
                      localStorage.setItem(PRESETS_KEY, JSON.stringify(DEFAULT_PRESETS));
                  }
              } catch(e) {
                  setPresets(DEFAULT_PRESETS);
              }
          }, []);

          // 初回ロード
          useEffect(() => {
              let loadedItems = [...initialData];
              try {
                  const savedData = localStorage.getItem(STORAGE_KEY_V2);
                  if (savedData) {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { ...item, ...history } : item;
                      });
                  }
              } catch(e) {}
              setItems(loadedItems);

              try {
                  const s = localStorage.getItem(SETTINGS_KEY);
                  if (s) {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  }
              } catch(e) {}
          }, [initialData]);

          useEffect(() => {
              if (items.length > 0 && !currentItem && !isFinished) {
                 nextQuestion(items, activeMode);
              }
          }, [items]);

          // SpeechRecognition 安全な初期化
          useEffect(() => {
              try {
                  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                      const recognition = new SpeechRecognition();
                      recognition.lang = 'ja-JP';
                      recognition.continuous = false;
                      recognition.interimResults = true;
                      
                      recognition.onresult = (event) => {
                          const transcript = Array.from(event.results)
                              .map(r => r[0].transcript)
                              .join('');
                          setDictationResult(transcript);
                      };
                      recognition.onerror = () => setIsListening(false);
                      recognition.onend = () => setIsListening(false);
                      recognitionRef.current = recognition;
                  }
              } catch(e) {}
          }, []);

          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) {
                      dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
                  }
              });
              try { localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave)); } catch(e) {}
          };

          const nextQuestion = (currentItems, mode) => {
              let targetGroup = currentItems;
              let unmastered = [];

              if (mode === 'star') {
                  targetGroup = currentItems.filter(i => i.star);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else if (mode === 'ng') {
                  targetGroup = currentItems.filter(i => !i.ok);
                  unmastered = targetGroup.filter(i => !i.ok);
              } else if (mode === 'ok') {
                  targetGroup = currentItems.filter(i => i.ok);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else {
                  targetGroup = currentItems;
                  unmastered = targetGroup.filter(i => !i.ok);
              }

              if (unmastered.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  syncStudyData(); // 全問完了時に自動同期
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);
              
              const totalW = unmastered.reduce((s, i) => s + i.w, 0);
              let r = Math.random() * totalW;
              let selected = null;
              for (let i of unmastered) {
                  if (r < i.w) { selected = i; break; }
                  r -= i.w;
              }
              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          // ★ 反転モード（""の中を答えと置換するロジック）
          const displayData = useMemo(() => {
              if (!currentItemDetail) return { q: '', a: '' };
              let q = currentItemDetail.q;
              let a = currentItemDetail.a;

              if (settings.reverseMode) {
                  const match = q.match(/"([^"]+)"/);
                  if (match) {
                      q = q.replace(/"([^"]+)"/, `"${a}"`);
                      a = match[1];
                  } else {
                      const temp = q;
                      q = a;
                      a = temp;
                  }
              }
              return { q, a };
          }, [currentItemDetail, settings.reverseMode]);

          const displayQuestion = displayData.q;
          const displayAnswer = displayData.a;

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings, displayAnswer]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = displayAnswer.trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || 
                  userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings, displayAnswer]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      if (activeMode === 'star') {
                          return { 
                              ...item, 
                              w: isOk ? 1 : item.w + 200, 
                              ok: isOk ? true : item.ok, 
                              star: isOk ? false : item.star, 
                              sessionDone: isOk 
                          };
                      } else {
                          return { 
                              ...item, 
                              w: isOk ? 1 : item.w + 200, 
                              ok: isOk,
                              sessionDone: isOk
                          };
                      }
                  }
                  return item;
              });
              if (isOk) {
                  updateLeaderboardStats(1); // ローカル集計を即時加算
              }
              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode]);

          const toggleStar = (id) => {
              const newItems = items.map(item => item.id === id ? { ...item, star: !item.star } : item);
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) {
                 showToast(target.star ? "★ 要復習に追加" : "★ 要復習から外しました");
              }
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              try {
                  window.speechSynthesis.cancel();
                  const u = new SpeechSynthesisUtterance(text);
                  const englishPattern = /^[A-Za-z0-9\s,.:?!'"()\-]+$/;
                  if (englishPattern.test(text.replace(/[\s\d]/g, ''))) {
                      u.lang = 'en-US';
                  } else {
                      u.lang = 'ja-JP';
                  }
                  u.rate = speechRates[rateIdx]?.value || 1.0;
                  window.speechSynthesis.speak(u);
              } catch(e) {}
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) {
                  showToast('お使いのブラウザは音声認識に対応していません');
                  return;
              }
              if (isListening) {
                  recognitionRef.current.stop();
                  setIsListening(false);
              } else {
                  setDictationResult('');
                  try {
                      recognitionRef.current.start();
                      setIsListening(true);
                  } catch(e) {
                      showToast('音声認識を開始できません');
                  }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings)); } catch(e) {}
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const applyPreset = (preset) => {
              const newSettings = { ...settings, ...preset.settings };
              setSettings(newSettings);
              try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings)); } catch(e) {}
              if (newSettings.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = {
                  id: `preset_${Date.now()}`,
                  name: presetName.trim(),
                  settings: { ...settings }
              };
              const updated = [...presets, newPreset];
              setPresets(updated);
              try { localStorage.setItem(PRESETS_KEY, JSON.stringify(updated)); } catch(e) {}
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              const updated = presets.filter(p => p.id !== id);
              setPresets(updated);
              try { localStorage.setItem(PRESETS_KEY, JSON.stringify(updated)); } catch(e) {}
              showToast('プリセットを削除しました');
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          const startFocusedLearning = () => {
              const newItems = items.map(i => ({ ...i, sessionDone: false }));
              setItems(newItems);
              setActiveMode(listFilter);
              setModals({ ...modals, list: false });
              nextQuestion(newItems, listFilter);
              showToast("集中学習モードを開始しました");
          };

          const applyCustomData = () => {
              try {
                  localStorage.setItem(CUSTOM_DATA_KEY, tempRawText);
                  localStorage.removeItem(STORAGE_KEY_V2);
              } catch(e) {}
              setRawText(tempRawText);
              setActiveMode('all');
              setModals(prev => ({ ...prev, edit: false }));
              showToast("新しい問題データを適用しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの漢字テスト問題に戻します。よろしいですか？")) {
                  try {
                      localStorage.removeItem(CUSTOM_DATA_KEY);
                      localStorage.removeItem(STORAGE_KEY_V2);
                  } catch(e) {}
                  setRawText(DEFAULT_EXCEL_DATA);
                  setTempRawText(DEFAULT_EXCEL_DATA);
                  setActiveMode('all');
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("デフォルトに戻しました");
              }
          };

          const resetAllData = () => {
              if (window.confirm("全学習履歴(進捗・★マーク)を削除して最初からやり直します。\nよろしいですか？")) {
                  try { localStorage.removeItem(STORAGE_KEY_V2); } catch(e) {}
                  const freshItems = parseProblemData(rawText);
                  setItems(freshItems);
                  setActiveMode('all');
                  setModals({ ...modals, menu: false });
                  nextQuestion(freshItems, 'all');
                  showToast("学習データをリセットしました");
              }
          };

          const downloadFile = (filename, content, mimeType) => {
              const blob = new Blob([content], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
          };

          const exportJSON = () => {
              const data = {
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  appTitle: appTitle,
                  settings: settings,
                  presets: presets,
                  progress: Object.fromEntries(items.filter(i => i.ok || i.star || i.w !== 100).map(i => [i.q, { w: i.w, ok: i.ok, star: i.star }])),
                  customData: rawText
              };
              downloadFile(`${appTitle}_backup.json`, JSON.stringify(data, null, 2), 'application/json');
              showToast('設定とデータをエクスポートしました');
          };

          const importJSON = () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json';
              input.onchange = (e) => {
                  const file = e.target.files[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                      try {
                          const data = JSON.parse(ev.target.result);
                          if (!window.confirm(`バックアップを読み込みます。現在の設定・進捗・データは上書きされます。\nよろしいですか？`)) return;
                          
                          if (data.settings) {
                              setSettings(data.settings);
                              localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
                              if (data.settings.darkMode) document.documentElement.classList.add('dark');
                              else document.documentElement.classList.remove('dark');
                          }
                          if (data.presets) {
                              setPresets(data.presets);
                              localStorage.setItem(PRESETS_KEY, JSON.stringify(data.presets));
                          }
                          if (data.customData !== undefined) {
                              setRawText(data.customData);
                              localStorage.setItem(CUSTOM_DATA_KEY, data.customData);
                              localStorage.removeItem(STORAGE_KEY_V2);
                              const finalItems = parseProblemData(data.customData);
                              setItems(finalItems);
                              saveItems(finalItems);
                              setActiveMode('all');
                          }
                          showToast('バックアップを読み込みました');
                      } catch(err) {
                          showToast('JSONの解析に失敗しました');
                      }
                  };
                  reader.readAsText(file);
              };
              input.click();
          };

          // キャンバス描画
          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');
              
              let clientX, clientY, pressure = 0.5;
              if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX;
                  clientY = e.touches[0].clientY;
                  if (e.touches[0].force !== undefined) {
                      pressure = Math.max(0.1, e.touches[0].force);
                  }
              } else {
                  clientX = e.clientX;
                  clientY = e.clientY;
                  const native = e.nativeEvent || e;
                  if (native.pressure !== undefined && native.pressure > 0) {
                      pressure = native.pressure;
                  }
              }

              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;
              
              const x = (clientX - rect.left) * scaleX;
              const y = (clientY - rect.top) * scaleY;

              const now = Date.now();
              const dt = now - lastTime.current;
              const dx = x - lastX.current;
              const dy = y - lastY.current;
              const dist = Math.sqrt(dx * dx + dy * dy);
              let speed = dist / (dt || 1);
              if (speed > 5) speed = 5;

              const native = e.nativeEvent || e;
              let targetWidth = 4.5;
              if (native.pointerType === 'pen' || (e.touches && e.touches.length > 0)) {
                  targetWidth = 1.5 + (pressure * 8.5); 
              } else {
                  targetWidth = 6.8 - (speed * 1.0); 
              }

              currentStrokeWidth.current = currentStrokeWidth.current * 0.72 + targetWidth * 0.28;
              if (currentStrokeWidth.current < 1.5) currentStrokeWidth.current = 1.5;
              if (currentStrokeWidth.current > 10.0) currentStrokeWidth.current = 10.0;

              ctx.lineWidth = currentStrokeWidth.current;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              ctx.beginPath();
              ctx.moveTo(lastX.current, lastY.current);
              ctx.lineTo(x, y);
              ctx.stroke();

              lastX.current = x;
              lastY.current = y;
              lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas;
              isDrawing.current = true;
              
              let clientX, clientY;
              if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX;
                  clientY = e.touches[0].clientY;
              } else {
                  clientX = e.clientX;
                  clientY = e.clientY;
              }

              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;

              lastX.current = (clientX - rect.left) * scaleX;
              lastY.current = (clientY - rect.top) * scaleY;
              lastTime.current = Date.now();
              currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => {
              if (e) e.preventDefault();
              isDrawing.current = false;
          };

          // キャンバスHD補正
          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2;
                  canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5;
                  ctx.lineCap = 'round';
                  ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };

              if (settings.showCanvas && !isFinished && currentItemDetail) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition === 'left' || settings.canvasPosition === 'right') {
                          setupCanvas(canvasRightRef.current);
                      }
                  }, 100);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale]);

          // キーボードショートカット
          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || modals.leaderboard || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                
                  if (!isRevealed) {
                      if (settings.enableInput) {
                          if (e.code === 'Enter') {
                              e.preventDefault();
                              handleInputSubmit();
                          }
                      } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { 
                          e.preventDefault(); 
                          handleReveal(); 
                      }
                  } else {
                      if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                      else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                      else if ((e.code === 'Space' || e.code === 'Enter') && settings.enableKeyboardSpeak) { 
                          e.preventDefault(); 
                          speak(displayAnswer); 
                      }
                  }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit, displayAnswer]);

          // 自動フォーカス
          useEffect(() => {
              if (settings.enableInput && !isRevealed && !isFinished && currentItemDetail && inputRef.current) {
                  const timer = setTimeout(() => { inputRef.current?.focus(); }, 200);
                  return () => clearTimeout(timer);
              }
          }, [currentItemDetail, settings.enableInput, isRevealed, isFinished]);

          // 3分ごとのバックグラウンド自動同期
          useEffect(() => {
              const timer = setInterval(() => {
                  syncStudyData();
              }, 180000);
              return () => clearInterval(timer);
          }, [syncStudyData]);

          const okCount = activeItems.filter(i => i.ok).length;
          const totalCount = activeItems.length;
          const progressPercent = totalCount === 0 ? 0 : Math.floor((okCount / totalCount) * 100);

          const getModeLabel = () => {
              if (activeMode === 'star') return '★ 要復習';
              if (activeMode === 'ng') return '未マスター';
              if (activeMode === 'ok') return 'マスター済';
              return '';

          const classSizeQ = fontSizesQ[settings.fontSizeQIndex]?.class || 'text-xl sm:text-2xl';
          const classSizeA = fontSizesA[settings.fontSizeAIndex]?.class || 'text-2xl sm:text-3xl font-bold';

          const isSidePanel = settings.showCanvas && settings.canvasPosition !== 'overlay' && !isFinished;

          return (
              <div className={`min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex ${isSidePanel ? 'items-start' : 'items-center'} justify-center p-4 transition-colors duration-200`}>
                
                  {/* メインレイアウトコンテナ */}
                  <div className={`flex ${isSidePanel ? 'flex-row gap-4 items-start' : 'flex-col items-center'} w-full ${isSidePanel ? 'max-w-[900px]' : 'max-w-lg'}`}>

                      {/* メインカード列 */}
                      <div className={`flex flex-col items-center ${isSidePanel ? 'max-w-lg flex-1' : 'w-full'}`}

                          {/* メインカード本体 */}
                          <div className="bg-white dark:bg-slate-900 w-full p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80 transition-colors duration-200 relative"
                              style={{ zoom: settings.displayScale }}>
                          
                          {/* ヘッダーエリア */}
                          <div className="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-850 pb-3">
                              <div>
                                  <h1 className="text-lg font-bold tracking-tight text-slate-800 dark:text-slate-100">{appTitleName}</h1>
                                  {authUser ? (

                                          <IconUser size={12} />
                                          <span>{authUser.name}</span>
                                          <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 underline ml-1">ログアウト</button>
                                      </div>
                                  ) : (
                                      <button onClick={() => setModals({ ...modals, leaderboard: true })} className="text-[11px] text-slate-400 hover:text-blue-500 font-bold flex items-center gap-1 mt-0.5">

                                      </button>

                              </div>
                              <div className="flex items-center gap-1">
                                  {/* ③ トロフィーアイコン（リーダーボード） */}

                                      className="p-2 rounded-xl text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-950/30 transition-all"

                                      <IconTrophy size={20} />
                                  </button>

                                  {/* 設定ボタン */}
                                  <button

                                              </div>

                                      </div>
                                  )}

                                  {/* テキスト入力エリア */}
                                  {settings.enableInput && !isRevealed && (
                                      <div className="flex flex-col gap-2">
                                          <div className="flex gap-2">
                                              <input
                                                  ref={inputRef}
                                                  type="text"
                                                  value={inputValue}
                                                  onChange={(e) => { setInputValue(e.target.value); setInputResult(null); }}
                                                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleInputSubmit(); } }}
                                                  placeholder="答えを入力..."
                                                  className="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold"
                                              />
                                              <button
                                                  onClick={handleInputSubmit}
                                                  disabled={!inputValue.trim()}
                                                  className="px-5 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-200 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white font-bold rounded-xl transition-all text-sm"
                                              >
                                                  確認
                                              </button>
                                          </div>
                                      </div>
                                  )}

                                  {inputResult && isRevealed && (
                                      <div className={`text-center py-2 px-4 rounded-xl font-bold text-sm animate-reveal ${inputResult === 'correct' ? 'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/30' : 'bg-rose-50 dark:bg-rose-950/20 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/30'}`}>
                                          {inputResult === 'correct' ? '正解！' : '不正解...'}
                                      </div>
                                  )}

                                  {/* アクションボタン */}
                                  <div className="flex flex-col gap-3">
                                      {!isRevealed && !settings.enableInput ? (
                                          <button
                                              onClick={handleReveal}
                                              className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_3px_0_#1e40af] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                          >
                                              <span className="text-base tracking-wide">正解を見る</span>
                                              <span className="text-[10px] font-normal opacity-60 mt-0.5">Space / Enter</span>
                                          </button>
                                      ) : (
                                          <div className="flex gap-3 animate-in fade-in duration-200">
                                              <button
                                                  onClick={() => handleResult(false)}
                                                  className="flex-1 py-3.5 bg-red-500 hover:bg-red-400 dark:bg-red-600 dark:hover:bg-red-500 text-white font-bold rounded-xl shadow-[0_3px_0_#dc2626] dark:shadow-[0_3px_0_#991b1b] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >
                                                  <span className="text-base">もう一度</span>
                                                  <span className="text-[10px] font-normal opacity-60 mt-0.5">←</span>
                                              </button>
                                              <button
                                                  onClick={() => handleResult(true)}
                                                  className="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-400 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-bold rounded-xl shadow-[0_3px_0_#059669] dark:shadow-[0_3px_0_#047857] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >

                                              </button>
                                          </div>
                                      )}
                                  </div>
                              </div>
                          ) : (
                              <div className="flex flex-col items-center justify-center py-10 gap-5 text-center">
                                  <IconCheckCircle size={56} className="text-emerald-500 animate-in zoom-in" />
                                  <div>
                                      <h2 className="text-xl font-bold mb-1.5">すべての学習が完了しました！</h2>
                                      <p className="text-sm text-slate-400 dark:text-slate-500">対象の問題をすべてマスターしました。</p>
                                  </div>
                                  {activeMode !== 'all' && (
                                      <button
                                          onClick={() => { 
                                              const newItems = items.map(i => ({ ...i, sessionDone: false }));
                                              setItems(newItems);
                                              setActiveMode('all'); 
                                              nextQuestion(newItems, 'all'); 
                                          }}
                                          className="w-full py-3.5 mt-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-bold rounded-xl shadow-[0_3px_0_#94a3b8] dark:shadow-[0_3px_0_#1e293b] active:translate-y-[3px] active:shadow-none transition-all"
                                      >

                          </div>

                          {/* 出典表示 */}
                          <div className="mt-8 text-center px-4">
                              <p className="text-[10px] sm:text-xs text-slate-400 dark:text-slate-500 tracking-wide leading-relaxed">

                      </div>

                      {/* サイドパネルキャンバス（order で左右配置） */}
                      {isSidePanel && (
                          <div className="w-72 shrink-0 sticky top-4"
                               style={{
                                   zoom: settings.displayScale,

                               }}>
                              <div className="bg-white dark:bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80">
                                  <div className="flex items-center justify-between mb-3">
                                      <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400">手書きキャンバス</h3>
                                      <button
                                          onClick={() => updateSetting('canvasPosition', 'overlay')}
                                          className="p-1 text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 rounded-lg transition-colors"

                                      <canvas

                                          onPointerMove={draw}
                                          onPointerUp={stopDrawing}

                                          onMouseMove={draw}

                  </div>

                  {/* 設定モーダル */}
                  {modals.menu && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200" onClick={(e) => e.target === e.currentTarget && setModals({...modals, menu: false})}>

                                                      <span className="flex-1 truncate">{r.name}</span>
                                                      <span className="text-amber-600 dark:text-amber-400 shrink-0">
                                                          {leaderboardType === 'time' ? `${Math.floor((r.score || 0)/60)}分` : `${r.score || 0}問`}
                                                      </span>
                                                  </div>
                                              ))
                                          )}
                                      </div>

                                      <button
                                          onClick={() => fetchRankings(leaderboardType)}
                                          disabled={rankingsLoading}
                                          className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 font-bold rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5"
                                      >
                                          <span>データを同期して更新</span>
                                      </button>
                                  </div>
                              </div>

                              <div className="p-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, leaderboard: false})} className="py-2.5 px-6 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 問題リスト モーダル */}
                  {modals.list && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, list: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-2xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <h3 className="text-lg font-bold">問題リスト</h3>
                                  <button onClick={() => setModals({...modals, list: false, menu: true})} className="p-1 text-slate-400 hover:text-slate-600"><IconX size={24} /></button>
                              </div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                                  {items.map(item => (
                                      <div key={item.id} className="flex gap-4 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/30 dark:bg-slate-800/40">
                                          <div className="flex flex-col gap-3 items-center shrink-0">
                                              {item.ok ? <IconCheckCircle size={20} className="text-emerald-500" /> : <div className="w-5 h-5 rounded-full border-2 border-slate-200 dark:border-slate-700" />}
                                              <button onClick={() => toggleStar(item.id)}>
                                                  <IconStar size={20} className={item.star ? "text-amber-400" : "text-slate-300"} fill={item.star ? "currentColor" : "none"} />
                                              </button>
                                          </div>
                                          <div>
                                              <div className="font-bold mb-1 leading-snug">{item.q}</div>
                                              <div className="text-sm font-serif text-blue-700 dark:text-blue-400 font-bold">{item.a}</div>
                                          </div>
                                      </div>
                                  ))}
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 問題データ編集 モーダル */}
                  {modals.edit && (
                          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                                  <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                      <h3 className="text-lg font-bold">問題データの編集</h3>
                                      <button onClick={() => setModals({...modals, edit: false, menu: true})} className="p-1 text-slate-400"><IconX size={24} /></button>
                                  </div>
                                  <div className="flex-1 p-4 flex flex-col gap-3 min-h-0">
                                      <textarea
                                          value={tempRawText}
                                          onChange={(e) => setTempRawText(e.target.value)}
                                          className="flex-1 w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-sm resize-none"
                                          placeholder="問題 [タブまたはスペース] 答え"
                                      />
                                  </div>
                                  <div className="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex gap-3 shrink-0">
                                      <button onClick={resetToDefaultData} className="px-4 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-bold">初期化</button>
                                      <button onClick={() => setModals({...modals, edit: false, menu: true})} className="px-4 py-3 bg-slate-100 dark:bg-slate-700 rounded-xl text-sm font-bold">戻る</button>
                                      <button onClick={applyCustomData} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">適用</button>
                                  </div>
                              </div>
                          </div>
                  )}

                  {/* トースト通知 */}
                  <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-slate-700 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-50 ${toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                      {toast.message}
                  </div>

              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
