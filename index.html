          0% { opacity: 0; transform: scale(0.96) translateY(8px); filter: blur(4px); }
          60% { transform: scale(1.01) translateY(-1px); filter: blur(0px); }

      const IconFolderOpen = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;
      const IconTrophy = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 8 4 8.5 4.5"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 16 4 15.5 4.5"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;

      const SETTINGS_KEY = 'settings_kanji_app';
      const PRESETS_KEY = 'presets_kanji_app';
      const AUTH_USER_KEY = 'auth_user_kanji_app';

      const speechRates = [
          { label: '遅め', value: 0.6 },

          { label: '標準', value: 1.0 }

      const fontSizesQ = [
          { label: '小', class: 'text-sm sm:text-base' },
          { label: '中', class: 'text-base sm:text-lg' },
          { label: '大', class: 'text-lg sm:text-xl' },
          { label: '特大', class: 'text-xl sm:text-2xl font-bold' },

      const fontSizesA = [
          { label: '小', class: 'text-lg sm:text-xl font-bold' },
          { label: '中', class: 'text-xl sm:text-2xl font-bold' },
          { label: '大', class: 'text-2xl sm:text-3xl font-bold' },

      ];

      const DEFAULT_PRESETS = [
          { id: 'preset_kanji_normal', name: '漢字ノーマル', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 4, reverseMode: false, showCanvas: false, showSpeakButton: true, enableDictation: false, enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay', displayScale: 1.2 } },
          { id: 'preset_kanji_write', name: '漢字手書き', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 4, reverseMode: false, showCanvas: true, showSpeakButton: true, enableDictation: false, enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay', displayScale: 1.2 } },
          { id: 'preset_english_normal', name: '英文/英単語ノーマル', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 2, reverseMode: false, showCanvas: false, showSpeakButton: true, enableDictation: false, enableKeyboardSpeak: true, enableInput: true, canvasPosition: 'overlay', displayScale: 1.2 } },
          { id: 'preset_english_write', name: '英単語手書き', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 2, reverseMode: false, showCanvas: true, showSpeakButton: true, enableDictation: false, enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay', displayScale: 1.2 } },
          { id: 'preset_english_type', name: '英単語手打ち', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 2, reverseMode: false, showCanvas: false, showSpeakButton: true, enableDictation: false, enableKeyboardSpeak: true, enableInput: true, canvasPosition: 'overlay', displayScale: 1.2 } },
          { id: 'preset_english_listen', name: '英単語/英文聞き取り', settings: { darkMode: false, autoSpeak: false, rateIndex: 2, fontSizeQIndex: 2, fontSizeAIndex: 2, reverseMode: false, showCanvas: false, showSpeakButton: true, enableDictation: true, enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay', displayScale: 1.2 } }
      ];

      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0 && !line.startsWith('//'))
              .map((line, i) => {
                  let q = '', a = '';
                  if (line.includes('\t')) {
                      const p = line.split('\t'); q = p[0].trim(); a = p[1].trim();
                  } else if (line.includes(',')) {
                      const p = line.split(','); q = p[0].trim(); a = p[1].trim();
                  } else {
                      const m = line.match(/^(.+?)[\s　]+(.+)$/);
                      if (m) { q = m[1].trim(); a = m[2].trim(); }
                      else { q = line.trim(); a = '？'; }
                  }
                  return { id: i + 1, q, a, w: 100, ok: false, star: false };
              });
      }

      function App() {
          // 問題セットの管理
          const [currentSetId, setCurrentSetId] = useState(() => {
              return localStorage.getItem('current_set_id') || PROBLEM_SETS[0].id;
          });

          const currentSet = useMemo(() => {
              return PROBLEM_SETS.find(s => s.id === currentSetId) || PROBLEM_SETS[0];
          }, [currentSetId]);

          const [rawText, setRawText] = useState(() => {
              return localStorage.getItem(`custom_data_${currentSetId}`) || currentSet.data;
          });

          // セット切り替え時にテキスト更新
          useEffect(() => {
              const saved = localStorage.getItem(`custom_data_${currentSetId}`) || currentSet.data;
              setRawText(saved);
              setTempRawText(saved);
              localStorage.setItem('current_set_id', currentSetId);
          }, [currentSetId, currentSet]);

          const initialData = useMemo(() => parseProblemData(rawText), [rawText]);

          const [items, setItems] = useState([]);
          const [activeMode, setActiveMode] = useState('all');
          const [currentItem, setCurrentItem] = useState(null);
          const [isRevealed, setIsRevealed] = useState(false);
          const [isFinished, setIsFinished] = useState(false);

          // 認証ユーザー情報 { classNum, studentNum, name }
          const [authUser, setAuthUser] = useState(() => {
              try { return JSON.parse(localStorage.getItem(AUTH_USER_KEY)) || null; }
              catch(e) { return null; }
          });
          const [loginClassNum, setLoginClassNum] = useState('');
          const [loginStudentNum, setLoginStudentNum] = useState('');
          const [loginPin, setLoginPin] = useState('');
          const [loginLoading, setLoginLoading] = useState(false);

          const [settings, setSettings] = useState({ 
              darkMode: false, autoSpeak: false, rateIndex: 2, 
              fontSizeQIndex: 3, fontSizeAIndex: 4, reverseMode: false, 
              showCanvas: true, showSpeakButton: true, enableDictation: false, 
              enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay', 
              displayScale: 1.2
          });

          const [presets, setPresets] = useState([]);
          const [presetName, setPresetName] = useState('');
          const [showPresetSave, setShowPresetSave] = useState(false);

          const [isListening, setIsListening] = useState(false);
          const [dictationResult, setDictationResult] = useState('');
          const recognitionRef = useRef(null);

          const [inputValue, setInputValue] = useState('');
          const [inputResult, setInputResult] = useState(null);
          const inputRef = useRef(null);

          const [modals, setModals] = useState({ menu: false, list: false, edit: false, leaderboard: false });
          const [activeTab, setActiveTab] = useState('study'); 
          const [tempRawText, setTempRawText] = useState(rawText);
          const [toast, setToast] = useState({ message: '', visible: false });
          const [listFilter, setListFilter] = useState('all');

          // リーダーボード用 state
          const [leaderboardType, setLeaderboardType] = useState('today'); // 'today' | 'week' | 'month' | 'current' | 'total'
          const [rankings, setRankings] = useState([]);
          const [rankingsLoading, setRankingsLoading] = useState(false);
          const [targetTestName, setTargetTestName] = useState('未設定');
          const [newTargetName, setNewTargetName] = useState('');

          // キャンバス操作 Ref
          const canvasRef = useRef(null);
          const canvasRightRef = useRef(null);
          const isDrawing = useRef(false);
          const lastX = useRef(0);
          const lastY = useRef(0);
          const lastTime = useRef(0);
          const currentStrokeWidth = useRef(4.0);
          const activeCanvasRef = useRef(null);

          const currentItemDetail = useMemo(() => {
              if (!currentItem) return null;
              return items.find(i => i.q === currentItem.q) || currentItem;
          }, [items, currentItem]);

          const activeItems = useMemo(() => {
              if (activeMode === 'star') return items.filter(i => i.star);
              if (activeMode === 'ng') return items.filter(i => !i.ok);
              if (activeMode === 'ok') return items.filter(i => i.ok);
              return items;
          }, [items, activeMode]);

          // ★★★ 最大の問題の解決：CORS・Load failed を根絶する GET通信ブリッジ ★★★
          const sendApiRequest = useCallback(async (payload) => {
              // 1. 学校Chromebook環境（学校GAS内蔵実行）
              if (typeof google !== 'undefined' && google.script && google.script.run) {
                  return new Promise((resolve, reject) => {
                      google.script.run
                          .withSuccessHandler(res => {
                              try { resolve(typeof res === 'string' ? JSON.parse(res) : res); }
                              catch(e) { resolve(res); }
                          })
                          .withFailureHandler(err => reject(err))
                          .relayToPersonalGAS(payload);
                  });
              }

              // 2. スマホ・GitHub Pages環境（GETリクエストで302リダイレクトCORSを完全突破）
              if (!PERSONAL_GAS_URL) return { status: 'error', message: 'API URL未設定' };

              try {
                  const query = encodeURIComponent(JSON.stringify(payload));
                  const url = `${PERSONAL_GAS_URL}?payload=${query}&_t=${Date.now()}`;
                  const res = await fetch(url, {
                      method: 'GET',
                      headers: { 'Accept': 'application/json' }
                  });
                  return await res.json();
              } catch (e) {
                  console.warn("API通信エラー:", e);
                  return { status: 'error', message: e.message };
              }
          }, []);

          // 累計・今日の集計
          const getStorageStatsKey = () => `stats_${currentSetId}`;
          const getLeaderboardStats = () => {
              try {
                  return JSON.parse(localStorage.getItem(getStorageStatsKey())) || { todayDate: '', todayCount: 0, totalMastered: 0 };
              } catch(e) { return { todayDate: '', todayCount: 0, totalMastered: 0 }; }
          };

          const updateLeaderboardStats = (newlyMastered) => {
              if (newlyMastered <= 0) return;
              const stats = getLeaderboardStats();
              const today = new Date().toISOString().slice(0, 10);
              if (stats.todayDate !== today) {
                  stats.todayDate = today;
                  stats.todayCount = newlyMastered;
              } else {
                  stats.todayCount += newlyMastered;
              }
              stats.totalMastered = (stats.totalMastered || 0) + newlyMastered;
              try { localStorage.setItem(getStorageStatsKey(), JSON.stringify(stats)); } catch(e) {}
          };

          // ログ同期（バルク送信）
          const syncStudyData = useCallback(async () => {
              if (!authUser) return;
              const stats = getLeaderboardStats();
              const payload = {
                  action: 'log',
                  classNum: authUser.classNum,
                  studentNum: authUser.studentNum,
                  userName: authUser.name,
                  masteredToday: stats.todayCount || 0,
                  totalMastered: stats.totalMastered || 0,
                  setId: currentSet.id,
                  setName: currentSet.name
              };
              try { await sendApiRequest(payload); } catch(e) {}
          }, [authUser, currentSet, sendApiRequest]);

          // ランキング取得
          const fetchRankings = useCallback(async (type = leaderboardType) => {
              setRankingsLoading(true);
              setLeaderboardType(type);
              try {
                  if (authUser) await syncStudyData();
                  const res = await sendApiRequest({ action: 'ranking', type: type, setId: currentSet.id });
                  if (res) {
                      if (res.rankings) setRankings(res.rankings);
                      if (res.targetName) setTargetTestName(res.targetName);
                  }
              } catch(e) {
                  showToast("ランキング取得に失敗しました");
              } finally {
                  setRankingsLoading(false);
              }
          }, [authUser, leaderboardType, currentSet, sendApiRequest, syncStudyData]);

          // 管理者（1組28番）の「今回」の指定
          const handleSetTarget = async () => {
              if (!newTargetName.trim()) return;
              try {
                  const res = await sendApiRequest({ action: 'set_target', targetName: newTargetName.trim() });
                  if (res && res.status === 'success') {
                      setTargetTestName(newTargetName.trim());
                      setNewTargetName('');
                      showToast("「今回」のテストを設定しました！");
                      fetchRankings(leaderboardType);
                  }
              } catch(e) {
                  showToast("設定に失敗しました");
              }
          };

          // 認証ログイン
          const handleLogin = async (e) => {
              if (e) e.preventDefault();
              if (!loginClassNum || !loginStudentNum || !loginPin) {
                  showToast("組、番号、暗証番号を入力してください");
                  return;
              }
              setLoginLoading(true);

              try {
                  const res = await sendApiRequest({
                      action: 'auth',
                      classNum: String(loginClassNum).trim(),
                      studentNum: String(loginStudentNum).trim(),
                      pin: String(loginPin).trim()
                  });

                  if (res && res.status === 'success' && res.name) {
                      const userObj = { classNum: loginClassNum, studentNum: loginStudentNum, name: res.name };
                      setAuthUser(userObj);
                      localStorage.setItem(AUTH_USER_KEY, JSON.stringify(userObj));
                      showToast(res.isFirstTime ? `暗証番号を設定しログインしました！(${res.name})` : `${res.name} さん、ログインしました！`);
                      setLoginPin('');
                      fetchRankings(leaderboardType);
                  } else {
                      showToast(res.message || "組・番号または暗証番号が違います");
                  }
              } catch(err) {
                  showToast("通信エラーが発生しました");
              } finally {
                  setLoginLoading(false);
              }
          };

          const handleLogout = () => {
              if (window.confirm("ログアウトしますか？")) {
                  try { localStorage.removeItem(AUTH_USER_KEY); } catch(e) {}
                  setAuthUser(null);
                  showToast("ログアウトしました");
              }
          };

          // 初回ロード（問題データとセーブデータ）
          useEffect(() => {
              const storageKey = `data_v2_${currentSetId}`;
              let loadedItems = [...initialData];
              try {
                  const savedData = localStorage.getItem(storageKey);
                  if (savedData) {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { ...item, ...history } : item;
                      });
                  }
              } catch(e) {}
              setItems(loadedItems);

              try {
                  const s = localStorage.getItem(SETTINGS_KEY);
                  if (s) {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  }
              } catch(e) {}
          }, [currentSetId, initialData]);

          useEffect(() => {
              if (items.length > 0 && !currentItem && !isFinished) {
                 nextQuestion(items, activeMode);
              }
          }, [items]);

          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) {
                      dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
                  }
              });
              try { localStorage.setItem(`data_v2_${currentSetId}`, JSON.stringify(dataToSave)); } catch(e) {}
          };

          const nextQuestion = (currentItems, mode) => {
              let targetGroup = currentItems;
              let unmastered = [];

              if (mode === 'star') {
                  targetGroup = currentItems.filter(i => i.star);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else if (mode === 'ng') {
                  targetGroup = currentItems.filter(i => !i.ok);
                  unmastered = targetGroup.filter(i => !i.ok);
              } else if (mode === 'ok') {
                  targetGroup = currentItems.filter(i => i.ok);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else {
                  targetGroup = currentItems;
                  unmastered = targetGroup.filter(i => !i.ok);
              }

              if (unmastered.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  syncStudyData();
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);
              
              const totalW = unmastered.reduce((s, i) => s + i.w, 0);
              let r = Math.random() * totalW;
              let selected = null;
              for (let i of unmastered) {
                  if (r < i.w) { selected = i; break; }
                  r -= i.w;
              }
              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          // ② 反転モード
          const displayData = useMemo(() => {
              if (!currentItemDetail) return { q: '', a: '' };
              let q = currentItemDetail.q;
              let a = currentItemDetail.a;

              if (settings.reverseMode) {
                  const match = q.match(/"([^"]+)"/);
                  if (match) {
                      q = q.replace(/"([^"]+)"/, `"${a}"`);
                      a = match[1];
                  } else {
                      const temp = q; q = a; a = temp;
                  }
              }
              return { q, a };
          }, [currentItemDetail, settings.reverseMode]);

          const displayQuestion = displayData.q;
          const displayAnswer = displayData.a;

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings, displayAnswer]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = displayAnswer.trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || 
                  userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings, displayAnswer]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      return { 
                          ...item, 
                          w: isOk ? 1 : item.w + 200, 
                          ok: isOk ? true : item.ok, 
                          star: (activeMode === 'star' && isOk) ? false : item.star, 
                          sessionDone: isOk 
                      };
                  }
                  return item;
              });
              if (isOk) updateLeaderboardStats(1);
              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode]);

          const toggleStar = (id) => {
              const newItems = items.map(item => item.id === id ? { ...item, star: !item.star } : item);
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) showToast(target.star ? "★ 要復習に追加" : "★ 要復習から外しました");
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              try {
                  window.speechSynthesis.cancel();
                  const u = new SpeechSynthesisUtterance(text);
                  u.lang = 'ja-JP';
                  u.rate = speechRates[rateIdx]?.value || 1.0;
                  window.speechSynthesis.speak(u);
              } catch(e) {}
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) { showToast('音声認識に対応していません'); return; }
              if (isListening) { recognitionRef.current.stop(); setIsListening(false); }
              else {
                  setDictationResult('');
                  try { recognitionRef.current.start(); setIsListening(true); }
                  catch(e) { showToast('音声認識を開始できません'); }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings)); } catch(e) {}
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          // キャンバス描画
          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');
              
              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              let pressure = (e.touches && e.touches[0].force) ? e.touches[0].force : (e.pressure || 0.5);

              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;
              const x = (clientX - rect.left) * scaleX;
              const y = (clientY - rect.top) * scaleY;

              const now = Date.now();
              const dt = now - lastTime.current;
              const dist = Math.hypot(x - lastX.current, y - lastY.current);
              let speed = Math.min(dist / (dt || 1), 5);

              let targetWidth = 4.5;
              if (e.pointerType === 'pen' || e.touches) targetWidth = 1.5 + (pressure * 8.5);
              else targetWidth = 6.8 - (speed * 1.0);

              currentStrokeWidth.current = Math.max(1.5, Math.min(10.0, currentStrokeWidth.current * 0.72 + targetWidth * 0.28));

              ctx.lineWidth = currentStrokeWidth.current;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              ctx.beginPath();
              ctx.moveTo(lastX.current, lastY.current);
              ctx.lineTo(x, y);
              ctx.stroke();

              lastX.current = x; lastY.current = y; lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas;
              isDrawing.current = true;
              
              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              const rect = canvas.getBoundingClientRect();
              lastX.current = (clientX - rect.left) * (canvas.width / rect.width);
              lastY.current = (clientY - rect.top) * (canvas.height / rect.height);
              lastTime.current = Date.now();
              currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => { if (e) e.preventDefault(); isDrawing.current = false; };

          // キャンバスHD補正
          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2; canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };

              if (settings.showCanvas && !isFinished && currentItemDetail) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition !== 'overlay') setupCanvas(canvasRightRef.current);
                  }, 100);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale, currentSetId]);

          // キーボードショートカット
          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || modals.leaderboard || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                  if (!isRevealed) {
                      if (settings.enableInput && e.code === 'Enter') { e.preventDefault(); handleInputSubmit(); }
                      else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); handleReveal(); }
                  } else {
                      if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                      else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                      else if ((e.code === 'Space' || e.code === 'Enter') && settings.enableKeyboardSpeak) { e.preventDefault(); speak(displayAnswer); }
                  }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit, displayAnswer]);

          const okCount = activeItems.filter(i => i.ok).length;
          const totalCount = activeItems.length;
          const progressPercent = totalCount === 0 ? 0 : Math.floor((okCount / totalCount) * 100);

          const classSizeQ = fontSizesQ[settings.fontSizeQIndex]?.class || 'text-xl sm:text-2xl';
          const classSizeA = fontSizesA[settings.fontSizeAIndex]?.class || 'text-2xl sm:text-3xl font-bold';
          const isSidePanel = settings.showCanvas && settings.canvasPosition !== 'overlay' && !isFinished;

          // 管理者判定 (1組28番)
          const isAdmin = authUser && String(authUser.classNum).trim() === "1" && String(authUser.studentNum).trim() === "28";

          // 今月の月表示 (例: "10月")
          const currentMonthName = `${new Date().getMonth() + 1}月`;

          return (
              <div className={`min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex ${isSidePanel ? 'items-start' : 'items-center'} justify-center p-4 transition-colors duration-200`}>
                
                  {/* メインレイアウト */}
                  <div className={`flex ${isSidePanel ? 'flex-row gap-4 items-start' : 'flex-col items-center'} w-full ${isSidePanel ? 'max-w-[900px]' : 'max-w-lg'}`}>

                      {/* メインカード列 */}
                      <div className={`flex flex-col items-center ${isSidePanel ? 'max-w-lg flex-1' : 'w-full'}`}
                           style={{ order: isSidePanel && settings.canvasPosition === 'left' ? 2 : 1 }}>

                          <div className="bg-white dark:bg-slate-900 w-full p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80 transition-colors duration-200 relative"
                              style={{ zoom: settings.displayScale }}>
                          
                          {/* ヘッダーエリア */}
                          <div className="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-850 pb-3">
                              <div className="flex-1 mr-2">
                                  <h1 className="text-base sm:text-lg font-bold tracking-tight text-slate-800 dark:text-slate-100">漢字テスト等練習用サイト</h1>
                                  
                                  {/* 問題セット切り替えドロップダウン */}
                                  <div className="flex items-center gap-2 mt-1">
                                      <select
                                          value={currentSetId}
                                          onChange={(e) => setCurrentSetId(e.target.value)}
                                          className="text-xs font-bold bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 py-1 px-2.5 rounded-lg border border-blue-200/60 dark:border-blue-800/40 focus:outline-none"
                                      >
                                          {PROBLEM_SETS.map(s => (
                                              <option key={s.id} value={s.id}>{s.name}</option>
                                          ))}
                                      </select>
                                      {authUser && (
                                          <span className="text-[11px] font-bold text-slate-400 truncate max-w-[120px]">
                                              {authUser.name}
                                          </span>
                                      )}
                                  </div>
                              </div>

                              <div className="flex items-center gap-1">
                                  {/* トロフィーアイコン（リーダーボード） */}
                                  <button
                                      onClick={() => { setModals({ ...modals, leaderboard: true }); fetchRankings(); }}
                                      className="p-2 rounded-xl text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-950/30 transition-all"
                                      title="ランキングを見る"
                                  >
                                      <IconTrophy size={20} />
                                  </button>

                                  <button
                                      onClick={() => setModals({ ...modals, menu: true })}
                                      className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
                                      title="設定を開く"
                                  >
                                      <IconSettings size={20} />
                                  </button>
                              </div>
                          </div>

                          {/* プログレスバー */}
                          <div className="mb-4">
                              <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-1.5">
                                  <div className="h-full bg-blue-500 dark:bg-blue-600 transition-all duration-300 ease-out" style={{ width: `${progressPercent}%` }} />
                              </div>
                              <div className="flex justify-between text-[11px] font-bold text-slate-400 dark:text-slate-500">
                                  <span>{okCount} / {totalCount} 問マスター</span>
                              </div>
                          </div>

                          {!isFinished ? (
                              <div className="flex flex-col gap-4">
                                  <div className="relative min-h-[200px] flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900/30 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/40 overflow-hidden shadow-inner">
                                      
                                      <button
                                          onClick={() => toggleStar(currentItemDetail?.id)}
                                          className={`absolute top-2 right-2 p-1.5 rounded-full transition-transform active:scale-90 z-20 ${currentItemDetail?.star ? 'text-amber-400' : 'text-slate-300 dark:text-slate-700 hover:text-amber-400'}`}
                                          title="要復習 (Sキー)"
                                      >
                                          <IconStar size={22} fill={currentItemDetail?.star ? "currentColor" : "none"} />
                                      </button>

                                      {settings.showSpeakButton && isRevealed && (
                                          <button
                                              onClick={() => speak(displayAnswer)}
                                              className="absolute top-2 left-2 p-1.5 rounded-full transition-all active:scale-90 z-20 text-blue-500 hover:text-blue-600 hover:bg-blue-50"
                                              title="読み上げ (Space)"
                                          >
                                              <IconVolume2 size={20} />
                                          </button>
                                      )}

                                      {/* カード内キャンバス */}
                                      {settings.showCanvas && (
                                          <div className="absolute inset-0 w-full h-full z-10 select-none">
                                              <canvas
                                                  ref={canvasRef}
                                                  onPointerDown={startDrawing}
                                                  onPointerMove={draw}
                                                  onPointerUp={stopDrawing}
                                                  onPointerLeave={stopDrawing}
                                                  onMouseDown={startDrawing}
                                                  onMouseMove={draw}
                                                  onMouseUp={stopDrawing}
                                                  onMouseLeave={stopDrawing}
                                                  onTouchStart={startDrawing}
                                                  onTouchMove={draw}
                                                  onTouchEnd={stopDrawing}
                                                  className="w-full h-full cursor-crosshair animate-in fade-in"
                                                  style={{ touchAction: 'none' }}
                                              />
                                              <button
                                                  onClick={clearCanvas}
                                                  className="absolute bottom-2 right-2 p-2 bg-white/80 dark:bg-slate-800/80 text-slate-400 hover:text-blue-500 rounded-lg shadow-sm border border-slate-200/40 pointer-events-auto"
                                                  title="消去"
                                              >
                                                  <IconTrash size={15} />
                                              </button>
                                          </div>
                                      )}

                                      {/* 問題文 */}
                                      <div className={`${classSizeQ} leading-relaxed text-center break-words w-full px-8 mb-4 mt-2 select-none pointer-events-none z-0 text-slate-700 dark:text-slate-200`}>
                                          {displayQuestion || '---'}
                                      </div>

                                      {/* 答え */}
                                      <div className="min-h-[64px] flex items-center justify-center w-full px-2 select-none pointer-events-none z-0">
                                          {isRevealed ? (
                                              <div className={`${classSizeA} font-serif text-blue-700 dark:text-blue-400 text-center animate-reveal`}>
                                                  {displayAnswer}
                                              </div>
                                          ) : (
                                              <div className="h-6 w-16 bg-slate-200/60 dark:bg-slate-800/60 rounded-md animate-pulse" />
                                          )}
                                      </div>
                                  </div>

                                  {/* アクションボタン */}
                                  <div className="flex flex-col gap-3">
                                      {!isRevealed ? (
                                          <button
                                              onClick={handleReveal}
                                              className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_3px_0_#1e40af] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                          >
                                              <span className="text-base tracking-wide">正解を見る</span>
                                              <span className="text-[10px] font-normal opacity-60 mt-0.5">Space / Enter</span>
                                          </button>
                                      ) : (
                                          <div className="flex gap-3 animate-in fade-in duration-200">
                                              <button
                                                  onClick={() => handleResult(false)}
                                                  className="flex-1 py-3.5 bg-red-500 hover:bg-red-400 text-white font-bold rounded-xl shadow-[0_3px_0_#dc2626] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >
                                                  <span className="text-base">もう一度</span>
                                                  <span className="text-[10px] font-normal opacity-60 mt-0.5">←</span>
                                              </button>
                                              <button
                                                  onClick={() => handleResult(true)}
                                                  className="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-xl shadow-[0_3px_0_#059669] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >
                                                  <span className="text-base">マスター</span>
                                                  <span className="text-[10px] font-normal opacity-60 mt-0.5">→</span>
                                              </button>
                                          </div>
                                      )}
                                  </div>
                              </div>
                          ) : (
                              <div className="flex flex-col items-center justify-center py-10 gap-5 text-center">
                                  <IconCheckCircle size={56} className="text-emerald-500 animate-in zoom-in" />
                                  <h2 className="text-xl font-bold">すべてマスターしました！</h2>
                                  <button
                                      onClick={() => { 
                                          const reset = items.map(i => ({ ...i, sessionDone: false, ok: false }));
                                          setItems(reset);
                                          saveItems(reset);
                                          nextQuestion(reset, 'all'); 
                                      }}
                                      className="py-3 px-6 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-md transition-all text-sm"
                                  >
                                      もう一度最初から挑戦
                                  </button>
                              </div>
                          )}
                          </div>
                      </div>

                      {/* サイドパネルキャンバス */}
                      {isSidePanel && (
                          <div className="w-72 shrink-0 sticky top-4"
                               style={{ zoom: settings.displayScale, order: settings.canvasPosition === 'left' ? 1 : 2 }}>
                              <div className="bg-white dark:bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80">
                                  <div className="flex items-center justify-between mb-3">
                                      <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400">手書きキャンバス</h3>
                                      <button onClick={() => updateSetting('canvasPosition', 'overlay')} className="p-1 text-slate-400 hover:text-blue-500 rounded-lg">
                                          <IconX size={14} />
                                      </button>
                                  </div>
                                  <div className="relative rounded-2xl overflow-hidden border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/30" style={{aspectRatio: '3/4'}}>
                                      <canvas
                                          ref={canvasRightRef}
                                          onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerLeave={stopDrawing}
                                          onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                          onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                                          className="w-full h-full cursor-crosshair"
                                          style={{ touchAction: 'none' }}
                                      />
                                  </div>
                                  <button onClick={clearCanvas} className="mt-3 w-full py-2 bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-blue-600 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                      <IconTrash size={14} /> 消去
                                  </button>
                              </div>
                          </div>
                      )}

                  </div>

                  {/* リーダーボード モーダル */}
                  {modals.leaderboard && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200" onClick={(e) => e.target === e.currentTarget && setModals({...modals, leaderboard: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-700 flex flex-col max-h-[85vh]">
                              
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <div className="flex items-center gap-2">
                                      <IconTrophy size={20} className="text-amber-500" />
                                      <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">ランキング (問題数)</h3>
                                  </div>
                                  <button onClick={() => setModals({...modals, leaderboard: false})} className="p-1 text-slate-400 hover:text-slate-600"><IconX size={20} /></button>
                              </div>

                              <div className="p-5 overflow-y-auto space-y-4 flex-1">
                                  {/* 今回のターゲット回案内 */}
                                  <div className="bg-amber-50 dark:bg-amber-950/30 p-2.5 rounded-xl border border-amber-200 dark:border-amber-800/40 text-center">
                                      <span className="text-[10px] text-amber-700 dark:text-amber-300 font-bold block">★ 現在の対象テスト</span>
                                      <span className="text-xs font-bold text-amber-900 dark:text-amber-100">{targetTestName}</span>
                                  </div>

                                  {/* ログイン/切替セクション */}
                                  {!authUser ? (
                                      <form onSubmit={handleLogin} className="bg-slate-50 dark:bg-slate-900/50 p-3.5 rounded-2xl border border-slate-200/60 space-y-2">
                                          <span className="text-xs font-bold text-slate-600 block">生徒ログイン（初回入力の暗証番号が登録されます）</span>
                                          <div className="grid grid-cols-2 gap-2">
                                              <input type="number" placeholder="組 (例: 1)" value={loginClassNum} onChange={(e) => setLoginClassNum(e.target.value)} className="w-full px-3 py-1.5 rounded-xl border text-xs font-bold bg-white dark:bg-slate-800" />
                                              <input type="number" placeholder="番号 (例: 15)" value={loginStudentNum} onChange={(e) => setLoginStudentNum(e.target.value)} className="w-full px-3 py-1.5 rounded-xl border text-xs font-bold bg-white dark:bg-slate-800" />
                                          </div>
                                          <input type="password" maxLength={4} placeholder="暗証番号 (4桁)" value={loginPin} onChange={(e) => setLoginPin(e.target.value)} className="w-full px-3 py-1.5 rounded-xl border text-xs font-bold bg-white dark:bg-slate-800" />
                                          <button type="submit" disabled={loginLoading} className="w-full py-2 bg-blue-600 text-white font-bold rounded-xl text-xs">{loginLoading ? '照合中...' : 'ログイン'}</button>
                                      </form>
                                  ) : (
                                      <div className="flex justify-between items-center bg-blue-50/70 p-3 rounded-xl border border-blue-200 text-xs">
                                          <div>
                                              <span className="text-[10px] text-blue-500 font-bold block">ログイン中</span>
                                              <span className="font-bold text-blue-900">{authUser.classNum}組{authUser.studentNum}番 {authUser.name}</span>
                                          </div>
                                          <button onClick={handleLogout} className="px-2.5 py-1 bg-white text-slate-500 hover:text-red-500 font-bold rounded-lg border text-[10px]">切替</button>
                                      </div>
                                  )}

                                  {/* ★ 管理者専用機能 (1組28番) ★ */}
                                  {isAdmin && (
                                      <div className="bg-rose-50 dark:bg-rose-950/30 p-3 rounded-2xl border border-rose-200 space-y-2">
                                          <span className="text-xs font-bold text-rose-700 block">👑 管理者メニュー (1組28番専用)</span>
                                          <div className="flex gap-1.5">
                                              <input
                                                  type="text"
                                                  placeholder="例: 3年⑤ または 夏休み明け"
                                                  value={newTargetName}
                                                  onChange={(e) => setNewTargetName(e.target.value)}
                                                  className="flex-1 px-3 py-1.5 rounded-xl border text-xs font-bold bg-white dark:bg-slate-800"
                                              />
                                              <button onClick={handleSetTarget} className="px-3 py-1.5 bg-rose-600 text-white font-bold rounded-xl text-xs">設定</button>
                                          </div>
                                      </div>
                                  )}

                                  {/* 期間切り替えタブ */}
                                  <div className="space-y-3">
                                      <div className="flex bg-slate-100 dark:bg-slate-900/60 rounded-xl p-1 gap-1 overflow-x-auto no-scrollbar">
                                          {[
                                              { id: 'today', label: '本日' },
                                              { id: 'week', label: '今週' },
                                              { id: 'month', label: currentMonthName },
                                              { id: 'current', label: '今回' },
                                              { id: 'total', label: '累計' }
                                          ].map(t => (
                                              <button
                                                  key={t.id}
                                                  onClick={() => fetchRankings(t.id)}
                                                  className={`flex-1 min-w-[50px] py-1.5 text-xs font-bold rounded-lg transition-all ${leaderboardType === t.id ? 'bg-white dark:bg-slate-700 text-amber-600 shadow-sm' : 'text-slate-500'}`}
                                              >
                                                  {t.label}
                                              </button>
                                          ))}
                                      </div>

                                      {/* ランキングリスト */}
                                      <div className="space-y-1.5 min-h-[160px] max-h-60 overflow-y-auto">
                                          {rankingsLoading ? (
                                              <div className="text-center py-8 text-slate-400 text-xs font-bold">集計中...</div>
                                          ) : rankings.length === 0 ? (
                                              <div className="text-center py-8 text-slate-400 text-xs font-bold">まだデータがありません</div>
                                          ) : (
                                              rankings.map((r, i) => (
                                                  <div key={i} className={`flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold ${i === 0 ? 'bg-amber-100/60 text-amber-900' : i === 1 ? 'bg-slate-200/60 text-slate-800' : i === 2 ? 'bg-orange-100/60 text-orange-900' : 'bg-slate-50 dark:bg-slate-900/40'}`}>
                                                      <span className="w-5 text-center">{i + 1}</span>
                                                      <span className="flex-1 truncate">{r.name}</span>
                                                      <span className="text-amber-600 shrink-0">{r.score || 0}問</span>
                                                  </div>
                                              ))
                                          )}
                                      </div>

                                      {/* シンプルで分かりやすい更新ボタン */}
                                      <button
                                          onClick={() => fetchRankings(leaderboardType)}
                                          disabled={rankingsLoading}
                                          className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-colors"
                                      >
                                          ランキングを更新
                                      </button>
                                  </div>
                              </div>

                              <div className="p-4 bg-slate-50 border-t flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, leaderboard: false})} className="py-2 px-5 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 設定モーダル */}
                  {modals.menu && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200" onClick={(e) => e.target === e.currentTarget && setModals({...modals, menu: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh] border border-slate-100 dark:border-slate-700">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <h3 className="text-base font-bold">オプション設定</h3>
                                  <button onClick={() => setModals({...modals, menu: false})} className="p-1.5 text-slate-400 hover:text-slate-600"><IconX size={20} /></button>
                              </div>
                              <div className="p-5 overflow-y-auto space-y-4">
                                  <div className="flex items-center justify-between">
                                      <span className="text-xs font-bold">手書きキャンバス</span>
                                      <input type="checkbox" checked={settings.showCanvas} onChange={(e) => updateSetting('showCanvas', e.target.checked)} />
                                  </div>
                                  <div className="flex items-center justify-between">
                                      <span className="text-xs font-bold">出題の反転 ("" の中を置換)</span>
                                      <input type="checkbox" checked={settings.reverseMode} onChange={(e) => updateSetting('reverseMode', e.target.checked)} />
                                  </div>
                                  <div className="flex items-center justify-between">
                                      <span className="text-xs font-bold">キャンバス位置</span>
                                      <div className="flex gap-1">
                                          <button onClick={() => updateSetting('canvasPosition', 'overlay')} className={`px-2 py-1 text-xs font-bold rounded-lg ${settings.canvasPosition === 'overlay' ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>カードのみ</button>
                                          <button onClick={() => updateSetting('canvasPosition', 'left')} className={`px-2 py-1 text-xs font-bold rounded-lg ${settings.canvasPosition === 'left' ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>左パネル</button>
                                          <button onClick={() => updateSetting('canvasPosition', 'right')} className={`px-2 py-1 text-xs font-bold rounded-lg ${settings.canvasPosition === 'right' ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>右パネル</button>
                                      </div>
                                  </div>
                              </div>
                              <div className="p-4 bg-slate-50 border-t flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, menu: false})} className="py-2 px-5 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* トースト通知 */}
                  <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-50 ${toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                      {toast.message}
                  </div>

              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
