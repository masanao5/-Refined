      function shuffleArray(arr) {
          const a = [...arr];
          for (let i = a.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
      }

      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0 && !line.startsWith('//'))
              .map((line, i) => {
                  let q = '', a = '';
                  if (line.includes('\t')) {
                      const p = line.split('\t'); q = p[0].trim(); a = p[1].trim();
                  } else if (line.includes(',')) {
                      const p = line.split(','); q = p[0].trim(); a = p[1].trim();
                  } else {
                      const m = line.match(/^(.+?)[\s　]+(.+)$/);
                      if (m) { q = m[1].trim(); a = m[2].trim(); }
                      else { q = line.trim(); a = '？'; }
                  }
                  return { 
                      id: i + 1, q, a, w: 100,
                      write: { ok: false, star: false, wrongCount: 0, consecutiveWrong: 0, lastWrongTime: 0 },
                      read: { ok: false, star: false, wrongCount: 0, consecutiveWrong: 0, lastWrongTime: 0 }
                  };
              });
      }

      function App() {

          const [rawText, setRawText] = useState(() => {

          const initialData = useMemo(() => parseProblemData(rawText), [rawText]);

          // ⑧ ミス確認モード時のインデックス

          const [settings, setSettings] = useState({ 
              darkMode: false, autoSpeak: false, rateIndex: 2, 
              fontSizeQIndex: 2, fontSizeAIndex: 2, reverseMode: false, 
              showCanvas: true, showSpeakButton: true, enableDictation: false, 
              enableKeyboardSpeak: true, enableInput: false, canvasPosition: 'overlay',

          });

          // ② プリセットを確実に初期保持
          const [presets, setPresets] = useState(() => {

          const [modals, setModals] = useState({ menu: false, list: false, edit: false, leaderboard: false });

          const [tempRawText, setTempRawText] = useState(rawText);

          const [leaderboardScope, setLeaderboardScope] = useState('individual');

          // キャンバス操作
          const canvasRef = useRef(null);
          const canvasRightRef = useRef(null);
          const isDrawing = useRef(false);
          const lastX = useRef(0);
          const lastY = useRef(0);
          const lastTime = useRef(0);

          const activeCanvasRef = useRef(null);

          // ⑨ 忘却防止クールダウンキュー (直前3問を記憶)
          const coolDownQueue = useRef([]);

          const getStatus = useCallback((item) => {
              if (!item) return { ok: false, star: false, wrongCount: 0, consecutiveWrong: 0 };
              return settings.reverseMode ? (item.read || {}) : (item.write || {});
          }, [settings.reverseMode]);

          const currentItemDetail = useMemo(() => {
              if (!currentItem) return null;
              return items.find(i => i.q === currentItem.q) || currentItem;
          }, [items, currentItem]);

          // ⑧ 現在のモードの全対象問題リスト
          const currentModeCandidates = useMemo(() => {
              return items.filter(i => {
                  const s = getStatus(i);
                  if (activeMode === 'star') return s.star;
                  if (activeMode === 'wrong1') return (s.wrongCount || 0) >= 1;
                  if (activeMode === 'wrong2') return (s.consecutiveWrong || 0) >= 2;
                  return true;
              });
          }, [items, activeMode, getStatus]);

          // ★★★ JSONP 通信 (CORS・Load failed 完全解消) ★★★
          const sendApiRequest = useCallback((payload) => {
              if (typeof google !== 'undefined' && google.script && google.script.run) {
                  return new Promise((resolve, reject) => {
                      google.script.run
                          .withSuccessHandler(res => {
                              try { resolve(typeof res === 'string' ? JSON.parse(res) : res); }
                              catch(e) { resolve(res); }
                          })
                          .withFailureHandler(err => reject(err))
                          .relayToPersonalGAS(payload);
                  });
              }

              return new Promise((resolve, reject) => {
                  const callbackName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                  const script = document.createElement('script');

                  const timeout = setTimeout(() => {
                      cleanup();
                      reject(new Error('タイムアウトしました'));
                  }, 12000);

                  function cleanup() {
                      clearTimeout(timeout);
                      delete window[callbackName];
                      if (script.parentNode) script.parentNode.removeChild(script);
                  }

                  window[callbackName] = function(data) {
                      cleanup();
                      resolve(data);
                  };

                  script.onerror = function() {
                      cleanup();
                      reject(new Error('通信に失敗しました'));
                  };

                  const query = encodeURIComponent(JSON.stringify(payload));
                  script.src = `${PERSONAL_GAS_URL}?callback=${callbackName}&payload=${query}&_t=${Date.now()}`;
                  document.body.appendChild(script);
              });
          }, []);

          // ③ 演習量（解いた問題数）のローカル記録
          const getStorageStatsKey = () => `stats_exercise_${currentSetId}`;
          const getExerciseStats = () => {
              try {
                  return JSON.parse(safeStorage.getItem(getStorageStatsKey())) || { todayDate: '', todayExercise: 0, totalExercise: 0 };
              } catch(e) { return { todayDate: '', todayExercise: 0, totalExercise: 0 }; }
          };

          const addExerciseCount = () => {
              const stats = getExerciseStats();
              const today = new Date().toISOString().slice(0, 10);
              if (stats.todayDate !== today) {
                  stats.todayDate = today;
                  stats.todayExercise = 1;
              } else {
                  stats.todayExercise += 1;
              }
              stats.totalExercise += 1;
              safeStorage.setItem(getStorageStatsKey(), JSON.stringify(stats));
          };

          // ⑥ 爆速同期（ランキング取得と同期を1回のリクエストに統合して待ち時間を激減）
          const fetchRankings = useCallback(async (type = leaderboardType) => {
              setRankingsLoading(true);
              setLeaderboardType(type);

              const stats = getExerciseStats();
              const syncData = authUser ? {
                  items: items.map(i => ({ q: i.q, write: i.write, read: i.read })),
                  stats: stats
              } : null;

              try {
                  // 同期とランキング取得を同時に実行
                  if (authUser) {
                      sendApiRequest({
                          action: 'sync_and_log',
                          classNum: authUser.classNum,
                          studentNum: authUser.studentNum,
                          userName: authUser.name,
                          syncData: syncData,
                          exerciseToday: stats.todayExercise || 0,
                          totalExercise: stats.totalExercise || 0,
                          setId: currentSet.id,
                          setName: currentSet.name,
                          clientEnv: (typeof google !== 'undefined') ? 'chromebook' : 'github'
                      }).catch(() => {});
                  }

                  const res = await sendApiRequest({ action: 'ranking', type: type, setId: currentSet.id });
                  if (res) {
                      if (res.rankings) setRankings(res.rankings);
                      if (res.classRankings) setClassRankings(res.classRankings);
                      if (res.targetInfo) {
                          setTargetTestInfo(res.targetInfo);
                          setSelectedTargetId(res.targetInfo.id);
                      }
                  }
              } catch(e) {
                  showToast("ランキング取得に失敗しました");
              } finally {
                  setRankingsLoading(false);
              }
          }, [authUser, leaderboardType, currentSet, items, sendApiRequest]);

          const handleSetTarget = async () => {
              const targetObj = PROBLEM_SETS.find(s => s.id === selectedTargetId);
              if (!targetObj) return;

              try {
                  const res = await sendApiRequest({ 
                      action: 'set_target', 
                      targetId: targetObj.id,
                      targetName: targetObj.name 
                  });
                  if (res && res.status === 'success') {
                      setTargetTestInfo({ id: targetObj.id, name: targetObj.name });
                      showToast(`「今回」を【${targetObj.name}】に設定しました！`);
                      fetchRankings(leaderboardType);
                  }
              } catch(e) {
                  showToast("設定に失敗しました");
              }
          };

          // ⑦ 初めて選ぶテストの時に前回の点数を聞くチェック
          const checkAndPromptSurvey = (userObj, setId) => {
              const doneKey = `${SURVEY_DONE_KEY}_${userObj.classNum}_${userObj.studentNum}_${setId}`;
              if (!safeStorage.getItem(doneKey)) {
                  setSurveyModal({
                      user: userObj,
                      setId: setId,
                      setName: currentSet.name
                  });
              }
          };

          const handleLogin = async (e) => {
              if (e) e.preventDefault();
              if (!loginClassNum || !loginStudentNum || !loginPin) {
                  showToast("組、番号、暗証番号を入力してください");
                  return;
              }
              setLoginLoading(true);

              try {
                  const res = await sendApiRequest({
                      action: 'auth',
                      classNum: String(loginClassNum).trim(),
                      studentNum: String(loginStudentNum).trim(),
                      pin: String(loginPin).trim()
                  });

                  if (res && res.status === 'success' && res.name) {
                      const userObj = { classNum: loginClassNum, studentNum: loginStudentNum, name: res.name };
                      setAuthUser(userObj);
                      safeStorage.setItem(AUTH_USER_KEY, JSON.stringify(userObj));
                      showToast(res.isFirstTime ? `暗証番号を登録しました！(${res.name})` : `${res.name} さん、ログインしました！`);
                      setLoginPin('');

                      if (res.cloudUserData && res.cloudUserData.items) {
                          setSyncPromptModal({
                              user: userObj,
                              cloudData: res.cloudUserData
                          });
                      } else {
                          checkAndPromptSurvey(userObj, currentSetId);
                          fetchRankings(leaderboardType);
                      }
                  } else {
                      showToast(res.message || "組・番号または暗証番号が違います");
                  }
              } catch(err) {
                  showToast("通信エラーが発生しました");
              } finally {
                  setLoginLoading(false);
              }
          };

          const applyCloudData = (cloudData) => {
              if (!cloudData || !cloudData.items) return;
              const merged = items.map(item => {
                  const cItem = cloudData.items.find(ci => ci.q === item.q);
                  return cItem ? { ...item, write: cItem.write || item.write, read: cItem.read || item.read } : item;
              });
              setItems(merged);
              saveItems(merged);
              if (cloudData.stats) {
                  safeStorage.setItem(getStorageStatsKey(), JSON.stringify(cloudData.stats));
              }
              setSyncPromptModal(null);
              showToast("クラウドの要復習リストを同期しました！");
              if (authUser) checkAndPromptSurvey(authUser, currentSetId);
              nextQuestion(merged, activeMode);
          };

          // ⑦ アンケート送信処理
          const handleSurveySubmit = async (e) => {
              if (e) e.preventDefault();
              if (!surveyScore) {
                  showToast("点数を入力してください");
                  return;
              }
              const doneKey = `${SURVEY_DONE_KEY}_${surveyModal.user.classNum}_${surveyModal.user.studentNum}_${surveyModal.setId}`;
              safeStorage.setItem(doneKey, 'true');

              try {
                  await sendApiRequest({
                      action: 'survey_score',
                      classNum: surveyModal.user.classNum,
                      studentNum: surveyModal.user.studentNum,
                      userName: surveyModal.user.name,
                      currentTestName: surveyModal.setName,
                      previousTestName: surveyPrevTest,
                      score: Number(surveyScore)
                  });
                  showToast("ご協力ありがとうございました！");
              } catch(err) {}

              setSurveyModal(null);
          };

          const handleSurveySkip = () => {
              const doneKey = `${SURVEY_DONE_KEY}_${surveyModal.user.classNum}_${surveyModal.user.studentNum}_${surveyModal.setId}`;
              safeStorage.setItem(doneKey, 'true');
              setSurveyModal(null);
          };

          const handleLogout = () => {
              if (window.confirm("ログアウトしますか？")) {
                  safeStorage.removeItem(AUTH_USER_KEY);
                  setAuthUser(null);
                  showToast("ログアウトしました");
              }
          };

          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  dataToSave[i.q] = { write: i.write, read: i.read }; 
              });
              safeStorage.setItem(`data_v2_${currentSetId}`, JSON.stringify(dataToSave));
          };

          // ⑨ 出題アルゴリズム（忘却防止クールダウンキュー ＆ ループ）
          const nextQuestion = (currentItems, mode, explicitIndex = null) => {
              const list = currentItems.filter(i => {
                  const s = getStatus(i);
                  if (mode === 'star') return s.star && !i.sessionDone;
                  if (mode === 'wrong1') return (s.wrongCount || 0) >= 1;
                  if (mode === 'wrong2') return (s.consecutiveWrong || 0) >= 2;
                  return !s.ok;
              });

              // ⑧ ミス確認モード
              if (mode === 'wrong1' || mode === 'wrong2') {
                  if (list.length === 0) {
                      setCurrentItem(null);
                      setIsFinished(false);
                      return;
                  }
                  setIsFinished(false);
                  const nextIdx = explicitIndex !== null ? explicitIndex : (candidateIndex >= list.length ? 0 : candidateIndex);
                  setCandidateIndex(nextIdx);
                  setCurrentItem(list[nextIdx]);
                  setIsRevealed(false);
                  clearCanvas();
                  return;
              }

              // すべて・要復習モード
              if (list.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);

              let candidates = list.filter(item => !coolDownQueue.current.includes(item.q));
              if (candidates.length === 0) {
                  candidates = list;
              }

              const shuffled = shuffleArray(candidates);
              const selected = shuffled[0];

              coolDownQueue.current.push(selected.q);
              if (coolDownQueue.current.length > 3) {
                  coolDownQueue.current.shift();
              }

              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          // 反転モード
          const displayData = useMemo(() => {
              if (!currentItemDetail) return { q: '', a: '' };
              let q = currentItemDetail.q;
              let a = currentItemDetail.a;

              if (settings.reverseMode) {
                  const match = q.match(/"([^"]+)"/);
                  if (match) {
                      q = q.replace(/"([^"]+)"/, `"${a}"`);
                      a = match[1];
                  } else {
                      const temp = q; q = a; a = temp;
                  }
              }
              return { q, a };
          }, [currentItemDetail, settings.reverseMode]);

          const displayQuestion = displayData.q;
          const displayAnswer = displayData.a;

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings, displayAnswer]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = displayAnswer.trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || 
                  userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings, displayAnswer]);

          // ③ 演習カウント加算
          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              addExerciseCount();

              const isRead = settings.reverseMode;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      const cur = isRead ? (item.read || {}) : (item.write || {});
                      const updatedStatus = {
                          ...cur,
                          ok: isOk,
                          star: (activeMode === 'star' && isOk) ? false : cur.star,
                          wrongCount: isOk ? cur.wrongCount : ((cur.wrongCount || 0) + 1),
                          consecutiveWrong: isOk ? 0 : ((cur.consecutiveWrong || 0) + 1),
                          lastWrongTime: isOk ? cur.lastWrongTime : Date.now()
                      };
                      return {
                          ...item,
                          sessionDone: isOk,
                          [isRead ? 'read' : 'write']: updatedStatus
                      };
                  }
                  return item;
              });

              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode, settings.reverseMode]);

          // ⑧ ミス確認モード時の「次へ」
          const handleNextOnly = () => {
              if (currentModeCandidates.length === 0) return;
              addExerciseCount();
              const nextIdx = (candidateIndex + 1) % currentModeCandidates.length;
              nextQuestion(items, activeMode, nextIdx);
          };

          const toggleStar = (id) => {
              const isRead = settings.reverseMode;
              const newItems = items.map(item => {
                  if (item.id === id) {
                      const cur = isRead ? (item.read || {}) : (item.write || {});
                      return {
                          ...item,
                          [isRead ? 'read' : 'write']: { ...cur, star: !cur.star }
                      };
                  }
                  return item;
              });
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) {
                  const s = isRead ? target.read : target.write;
                  showToast(s.star ? "要復習に追加しました" : "要復習から外しました");
              }
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              try {
                  window.speechSynthesis.cancel();
                  const u = new SpeechSynthesisUtterance(text);
                  u.lang = 'ja-JP';
                  u.rate = speechRates[rateIdx]?.value || 1.0;
                  window.speechSynthesis.speak(u);
              } catch(e) {}
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) { showToast('音声認識に対応していません'); return; }
              if (isListening) { recognitionRef.current.stop(); setIsListening(false); }
              else {
                  setDictationResult('');
                  try { recognitionRef.current.start(); setIsListening(true); }
                  catch(e) { showToast('音声認識を開始できません'); }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const applyPreset = (preset) => {
              const newSettings = { ...settings, ...preset.settings };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (newSettings.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = {
                  id: `preset_${Date.now()}`,
                  name: presetName.trim(),
                  settings: { ...settings }
              };
              const updated = [...presets, newPreset];
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              const updated = presets.filter(p => p.id !== id);
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              showToast('プリセットを削除しました');
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          // ④ データ管理機能
          const startFocusedLearning = () => {
              const filtered = items.filter(i => {
                  const s = getStatus(i);
                  if (listFilter === 'star') return s.star;
                  if (listFilter === 'ng') return !s.ok;
                  if (listFilter === 'ok') return s.ok;
                  return true;
              });
              setModals({ ...modals, list: false });
              setActiveMode(listFilter === 'star' ? 'star' : 'all');
              nextQuestion(shuffleArray(filtered), listFilter === 'star' ? 'star' : 'all');
              showToast("集中学習を開始しました");
          };

          const applyCustomData = () => {
              safeStorage.setItem(`custom_data_${currentSetId}`, tempRawText);
              safeStorage.removeItem(`data_v2_${currentSetId}`);
              setRawText(tempRawText);
              setModals(prev => ({ ...prev, edit: false }));
              showToast("問題データを更新しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの問題データに戻しますか？")) {
                  safeStorage.removeItem(`custom_data_${currentSetId}`);
                  safeStorage.removeItem(`data_v2_${currentSetId}`);
                  setRawText(currentSet.data);
                  setTempRawText(currentSet.data);
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("初期データに戻しました");
              }
          };

          // ③＆⑪ 「すべて」再開処理（★要復習は消さずにマスター状態だけリセット）
          const resetAllData = () => {
              const isRead = settings.reverseMode;
              const reset = items.map(item => {
                  const cur = isRead ? (item.read || {}) : (item.write || {});
                  return {
                      ...item,
                      sessionDone: false,
                      [isRead ? 'read' : 'write']: {
                          ...cur,
                          ok: false // マスターのみリセット！starやwrongCountは完全に維持
                      }
                  };
              });
              setItems(reset);
              saveItems(reset);
              coolDownQueue.current = [];
              setIsFinished(false);
              nextQuestion(shuffleArray(reset), 'all');
              showToast("要復習を維持したまま、最初から演習を開始しました！");
          };

          const exportJSON = () => {
              const data = {
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  setId: currentSet.id,
                  setName: currentSet.name,
                  settings: settings,
                  presets: presets,
                  progress: Object.fromEntries(items.map(i => [i.q, { write: i.write, read: i.read }])),
                  customData: rawText
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `${currentSet.name}_backup.json`;
              a.click();
              URL.revokeObjectURL(url);
              showToast('バックアップを保存しました');
          };

          const importJSON = () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json';
              input.onchange = (e) => {
                  const file = e.target.files[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                      try {
                          const data = JSON.parse(ev.target.result);
                          if (!window.confirm("バックアップを読み込みますか？")) return;
                          if (data.settings) setSettings(data.settings);
                          if (data.presets) setPresets(data.presets);
                          if (data.customData) {
                              setRawText(data.customData);
                              safeStorage.setItem(`custom_data_${currentSetId}`, data.customData);
                          }
                          showToast('読み込みました');
                      } catch(err) {
                          showToast('JSONの解析に失敗しました');
                      }
                  };
                  reader.readAsText(file);
              };
              input.click();
          };

          // キャンバス描画
          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');
              
              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              let pressure = (e.touches && e.touches[0].force) ? e.touches[0].force : (e.pressure || 0.5);

              const rect = canvas.getBoundingClientRect();
              const x = (clientX - rect.left) * (canvas.width / rect.width);
              const y = (clientY - rect.top) * (canvas.height / rect.height);

              const now = Date.now();
              const dt = now - lastTime.current;
              const dist = Math.hypot(x - lastX.current, y - lastY.current);
              let speed = Math.min(dist / (dt || 1), 5);

              let targetWidth = 4.5;
              if (e.pointerType === 'pen' || e.touches) targetWidth = 1.5 + (pressure * 8.5);
              else targetWidth = 6.8 - (speed * 1.0);

              currentStrokeWidth.current = Math.max(1.5, Math.min(10.0, currentStrokeWidth.current * 0.72 + targetWidth * 0.28));

              ctx.lineWidth = currentStrokeWidth.current;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              ctx.beginPath();
              ctx.moveTo(lastX.current, lastY.current);
              ctx.lineTo(x, y);
              ctx.stroke();

              lastX.current = x; lastY.current = y; lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas;
              isDrawing.current = true;
              
              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              const rect = canvas.getBoundingClientRect();
              lastX.current = (clientX - rect.left) * (canvas.width / rect.width);
              lastY.current = (clientY - rect.top) * (canvas.height / rect.height);
              lastTime.current = Date.now();
              currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => { if (e) e.preventDefault(); isDrawing.current = false; };

          // 初回ロード
          useEffect(() => {
              const storageKey = `data_v2_${currentSetId}`;
              let loadedItems = [...initialData];
              try {
                  const savedData = safeStorage.getItem(storageKey);
                  if (savedData) {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { 
                              ...item, 
                              write: history.write || item.write, 
                              read: history.read || item.read 
                          } : item;
                      });
                  }
              } catch(e) {}

              const shuffled = shuffleArray(loadedItems);
              setItems(shuffled);
              nextQuestion(shuffled, 'all');

              try {
                  const s = safeStorage.getItem(SETTINGS_KEY);
                  if (s) {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  }
              } catch(e) {}
          }, [currentSetId, initialData]);

          // キャンバスHD初期化
          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2; canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };

              if (settings.showCanvas) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition !== 'overlay') setupCanvas(canvasRightRef.current);
                  }, 80);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale, currentSetId]);

          // キーボード操作
          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || modals.leaderboard || syncPromptModal || surveyModal || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                  if (!isRevealed) {
                      if (settings.enableInput && e.code === 'Enter') { e.preventDefault(); handleInputSubmit(); }
                      else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); handleReveal(); }
                  } else {
                      if (activeMode === 'wrong1' || activeMode === 'wrong2') {
                          if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleNextOnly(); }
                      } else {
                          if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                          else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                          else if ((e.code === 'Space' || e.code === 'Enter') && settings.enableKeyboardSpeak) { e.preventDefault(); speak(displayAnswer); }
                      }
                  }
              };

                                          <div className="flex flex-col gap-3 items-center shrink-0">
                                              {getStatus(item).ok ? <IconCheckCircle size={20} className="text-emerald-500" /> : <div className="w-5 h-5 rounded-full border-2 border-slate-200 dark:border-slate-700" />}
                                              <button onClick={() => toggleStar(item.id)}>
                                                  <IconStar size={20} className={getStatus(item).star ? "text-amber-400" : "text-slate-300"} fill={getStatus(item).star ? "currentColor" : "none"} />
                                              </button>
                                          </div>
                                          <div>
                                              <div className="font-bold mb-1 leading-snug">{item.q}</div>
                                              <div className="text-sm font-serif text-blue-700 dark:text-blue-400 font-bold">{item.a}</div>
                                          </div>
                                      </div>
                                  ))}
                              </div>
                              <div className="p-4 bg-slate-50 dark:bg-slate-900 border-t flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, list: false})} className="py-2.5 px-6 bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-xl">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* ④ 完全復元された問題データ編集モーダル */}
                  {modals.edit && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <h3 className="text-lg font-bold">問題データの編集</h3>
                                  <button onClick={() => setModals({...modals, edit: false, menu: true})} className="p-1 text-slate-400"><IconX size={24} /></button>
                              </div>
                              <div className="flex-1 p-4 flex flex-col gap-3 min-h-0">
                                  <textarea
                                      value={tempRawText}
                                      onChange={(e) => setTempRawText(e.target.value)}
                                      className="flex-1 w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-sm resize-none"
                                      placeholder="問題 [タブまたはスペース] 答え"
                                  />
                              </div>
                              <div className="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex gap-3 shrink-0">
                                  <button onClick={resetToDefaultData} className="px-4 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-bold">初期化</button>
                                  <button onClick={() => setModals({...modals, edit: false, menu: true})} className="px-4 py-3 bg-slate-100 dark:bg-slate-700 rounded-xl text-sm font-bold">戻る</button>
                                  <button onClick={applyCustomData} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">適用</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* ⑦ 前回のテスト点数アンケートポップアップ */}
                  {surveyModal && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in">
                          <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl shadow-2xl p-6 border border-slate-100 dark:border-slate-700 space-y-4">
                              <div className="text-center">
                                  <div className="w-12 h-12 bg-blue-100 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-2">
                                      <IconTrophy size={24} />
                                  </div>
                                  <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">前回のテスト結果を教えてね！</h3>
                                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                                      漢字の伸びを調べるため、前回の点数を教えてください。（任意・スキップできます）
                                  </p>
                              </div>

                              <form onSubmit={handleSurveySubmit} className="space-y-3">
                                  <div>
                                      <label className="text-[10px] font-bold text-slate-400 block mb-1">前回のテストはどれ？</label>
                                      <select
                                          value={surveyPrevTest}
                                          onChange={(e) => setSurveyPrevTest(e.target.value)}
                                          className="w-full px-3 py-2 rounded-xl border text-xs font-bold bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 focus:outline-none"
                                      >
                                          {PROBLEM_SETS.map(s => (
                                              <option key={s.id} value={s.name}>{s.name}</option>
                                          ))}
                                          <option value="その他">その他のテスト</option>
                                      </select>
                                  </div>

                                  <div>
                                      <label className="text-[10px] font-bold text-slate-400 block mb-1">何点だった？</label>
                                      <input
                                          type="number"
                                          min="0"
                                          max="100"
                                          placeholder="例: 85 (0〜100点)"
                                          value={surveyScore}
                                          onChange={(e) => setSurveyScore(e.target.value)}
                                          className="w-full px-3 py-2 rounded-xl border text-xs font-bold bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 focus:outline-none"
                                          autoFocus
                                      />
                                  </div>

                                  <div className="space-y-2 pt-2">
                                      <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs shadow-md transition-all">
                                          送信して学習を始める
                                      </button>
                                      <button type="button" onClick={handleSurveySkip} className="w-full py-2 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 font-bold rounded-xl text-xs">
                                          今は答えない (スキップ)
                                      </button>
                                  </div>
                              </form>
                          </div>
                      </div>
                  )}

                  {/* 前回の結果・同期確認ポップアップ */}
                  {syncPromptModal && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in">
                          <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl shadow-2xl p-6 border border-slate-100 dark:border-slate-700 text-center space-y-4">
                              <div className="w-12 h-12 bg-amber-100 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 rounded-2xl flex items-center justify-center mx-auto">
                                  <IconTrophy size={24} />
                              </div>
                              <div>
                                  <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">前回のデータを同期しますか？</h3>
                                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                      {syncPromptModal.user.name} さんの前回の要復習リストや進捗がクラウドに保存されています。
                                  </p>
                              </div>
                              <div className="space-y-2 pt-2">
                                  <button onClick={() => applyCloudData(syncPromptModal.cloudData)} className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition-all shadow-md">
                                      同期して前回の続きから再開
                                  </button>
                                  <button onClick={() => { setSyncPromptModal(null); showToast("この端末のデータで開始します"); }} className="w-full py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl text-xs">
                                      この端末のデータを使う
                                  </button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* トースト通知 */}
                  <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-50 ${toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                      {toast.message}
                  </div>

              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
