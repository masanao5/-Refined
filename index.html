      function shuffleArray(arr) {
          const a = [...arr];
          for (let i = a.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
      }

      function parseProblemData(text) {
          const seen = new Set();
          const out = [];
          text.split('\n')
              .map(line => line.trim().replace(/[“”]/g, '"'))
              .filter(line => line.length > 0 && !line.startsWith('//') && !line.startsWith('#'))
              .forEach(line => {
                  let q = '', a = '';
                  if (line.includes('\t')) {
                      const p = line.split('\t'); q = p[0].trim(); a = (p[1] || '').trim();
                  } else if (line.includes(',')) {
                      const p = line.split(','); q = p[0].trim(); a = (p[1] || '').trim();
                  } else {
                      const m = line.match(/^(.+)[\s　]+(\S+)$/);
                      if (m) { q = m[1].trim(); a = m[2].trim(); }
                      else { q = line.trim(); a = '？'; }
                  }
                  const key = hashStr(q + '|' + a);
                  if (seen.has(key)) return;   // 同じ問題の重複は1つにまとめる
                  seen.add(key);
                  out.push({
                      id: out.length + 1, key, q, a, w: 100,
                      write: { ok: false, star: false, wrongCount: 0, consecutiveWrong: 0, lastWrongTime: 0 },
                      read: { ok: false, star: false, wrongCount: 0, consecutiveWrong: 0, lastWrongTime: 0 }
                  });
              });
          return out;
      }

      function getStatusFor(item, reverse) {

                      const dirty = dirtyRef.current[setId];
                      const cnt = pendingCountRef.current[setId] || 0;
                      if ((!dirty || dirty.size === 0) && cnt === 0) continue;

                      const entries = dirty ? Array.from(dirty.entries()) : [];
                      const batches = [];
                      for (let i = 0; i < entries.length; i += 300) batches.push(entries.slice(i, i + 300));
                      if (batches.length === 0) batches.push([]);

                      const setObj = PROBLEM_SETS.find(s => s.id === setId);
                      for (let b = 0; b < batches.length; b++) {
                          const res = await sendApiRequest({
                              action: 'sync_and_log', ...credOf(user),
                              userName: user.name,
                              setId: setId,
                              setName: setObj ? setObj.name : setId,
                              changes: Object.fromEntries(batches[b]),
                              countDelta: b === 0 ? cnt : 0,
                              clientEnv: (typeof google !== 'undefined') ? 'chromebook' : 'github'
                          });
                          if (!res || res.status !== 'success') {
                              if (res && res.code === 'auth') handleAuthExpired();
                              return;
                          }
                          if (!syncedRef.current[setId]) syncedRef.current[setId] = new Map();
                          const synced = syncedRef.current[setId];
                          batches[b].forEach(([k, enc]) => {
                              synced.set(k, enc);
                              if (dirty && dirty.get(k) === enc) dirty.delete(k);
                          });
                          if (b === 0) {
                              pendingCountRef.current[setId] = Math.max(0, (pendingCountRef.current[setId] || 0) - cnt);
                          }
                      }
                  }
              } catch(e) {
                  // 通信失敗時は変更を保持したまま次回の自動同期で再送する
              } finally {
                  syncingRef.current = false;
              }
          };

          const applyProgressToItems = (list, setId) => {
              const synced = syncedRef.current[setId] || new Map();
              const dirty = dirtyRef.current[setId] || new Map();
              return list.map(item => {
                  const enc = dirty.has(item.key) ? dirty.get(item.key) : synced.get(item.key);
                  return enc ? decodeEnc(item, enc) : item;
              });
          };

          const retryLoadProgress = async (setId) => {
              const user = authRef.current;
              if (!user) return;
              try {
                  const res = await sendApiRequest({ action: 'load_progress', ...credOf(user), setId });
                  if (res && res.status === 'success') {
                      syncedRef.current[setId] = new Map(Object.entries(res.progress || {}));
                      needsReloadRef.current[setId] = false;
                      if (currentSetIdRef.current === setId) {
                          setItems(prev => applyProgressToItems(prev, setId));
                      }
                  } else if (res && res.code === 'auth') {
                      handleAuthExpired();
                  }
              } catch(e) {}
          };

          const retryLoadUser = async () => {
              const user = authRef.current;
              if (!user) return;
              try {
                  const res = await sendApiRequest({ action: 'load_user', ...credOf(user) });
                  if (res && res.status === 'success') {
                      applyPrefs(res.prefs);
                      prefsLoadedRef.current = true;
                  } else if (res && res.code === 'auth') {
                      handleAuthExpired();
                  }
              } catch(e) {}
          };

          // 起動：今回の対象テストを取得 → ログイン済みなら設定を読み込み
          useEffect(() => {
              let cancelled = false;
              (async () => {
                  const user = authRef.current;
                  let res = null;
                  try {
                      res = await withTimeout(
                          sendApiRequest(user ? { action: 'load_user', ...credOf(user) } : { action: 'get_target' }),
                          8000
                      );
                  } catch(e) {}
                  if (cancelled) return;

                  if (res) {
                      if (user) {
                          if (res.status === 'success') {
                              applyPrefs(res.prefs);
                              prefsLoadedRef.current = true;
                          } else if (res.code === 'auth') {
                              safeStorage.removeItem(AUTH_USER_KEY);
                              authRef.current = null;
                              setAuthUser(null);
                          }
                      }
                      if (res.targetInfo) {
                          setTargetTestInfo(res.targetInfo);
                          setSelectedTargetId(res.targetInfo.id);
                          if (PROBLEM_SETS.some(s => s.id === res.targetInfo.id)) {
                              setCurrentSetId(res.targetInfo.id);   // ★ 起動時の選択テスト = 管理者が設定した今回のテスト
                          }
                      }
                  } else if (user) {
                      showToast("通信できませんでした。電波の良い場所で再読み込みしてください");
                  }
                  if (user) setShowLoginPopup(false);
                  setBootDone(true);
              })();
              return () => { cancelled = true; };
          }, []);

          // 起動時にログイン済みなら、今回テストのアンケートを確認
          useEffect(() => {
              if (bootDone && authUser && prefsLoadedRef.current && !surveyCheckedRef.current) {
                  surveyCheckedRef.current = true;
                  checkAndPromptSurvey(authUser, currentSetIdRef.current);
              }
          }, [bootDone, authUser]);

          // 問題の読み込み（テスト切替・問題編集・ログイン状態の変化で実行）
          useEffect(() => {
              if (!bootDone) return;
              const seq = ++loadSeqRef.current;
              const setId = currentSetId;
              const base = shuffleArray(parseProblemData(rawText));

              coolDownQueue.current = [];
              setCandidateIndex(0);
              setActiveMode('all');
              activeModeRef.current = 'all';
              setIsFinished(false);

              if (!authUser) {
                  setItems(base);
                  setProgressLoading(false);
                  nextQuestion(base, 'all');
                  return;
              }

              setItems(base);
              setCurrentItem(null);
              setProgressLoading(true);

              const finish = (ok, progress) => {
                  if (seq !== loadSeqRef.current) return;
                  if (ok) {
                      syncedRef.current[setId] = new Map(Object.entries(progress || {}));
                      needsReloadRef.current[setId] = false;
                  } else {
                      needsReloadRef.current[setId] = true;
                      if (!syncedRef.current[setId]) syncedRef.current[setId] = new Map();
                  }
                  const merged = applyProgressToItems(base, setId);
                  setItems(merged);
                  setProgressLoading(false);
                  nextQuestion(merged, 'all');
              };

              sendApiRequest({ action: 'load_progress', ...credOf(authUser), setId })
                  .then(res => {
                      if (res && res.status === 'success') finish(true, res.progress);
                      else if (res && res.code === 'auth') { handleAuthExpired(); }
                      else { showToast("進捗を読み込めませんでした。自動で再試行します"); finish(false); }
                  })
                  .catch(() => {
                      showToast("進捗を読み込めませんでした。自動で再試行します");
                      finish(false);
                  });
          }, [bootDone, currentSetId, rawText, authUser]);

          // 自動同期ループ（変更があるときだけ送信）＋ 画面を離れる時にも送信
          useEffect(() => {
              const timer = setInterval(() => {
                  if (!authRef.current) return;
                  if (!prefsLoadedRef.current) retryLoadUser();
                  const sid = currentSetIdRef.current;
                  if (needsReloadRef.current[sid]) retryLoadProgress(sid);
                  if (hasPending()) runSync();
              }, SYNC_INTERVAL_MS);
              const onVis = () => {
                  if (document.visibilityState === 'hidden' && authRef.current && hasPending()) runSync();
              };
              document.addEventListener('visibilitychange', onVis);
              return () => { clearInterval(timer); document.removeEventListener('visibilitychange', onVis); };
          }, []);

          // ════════════ ランキング（裏側で先読みし、開いた瞬間に表示） ════════════
          const fetchRankings = async ({ silent = false, afterSync = false } = {}) => {
              if (!silent) setRankingsRefreshing(true);
              try {
                  if (afterSync && authRef.current && hasPending()) await runSync();
                  const res = await sendApiRequest({ action: 'ranking' });
                  if (res && res.all) {
                      setRankingData(res);
                      if (res.targetInfo) setTargetTestInfo(res.targetInfo);
                  }
              } catch(e) {
                  if (!silent) showToast("ランキング取得に失敗しました");
              } finally {
                  if (!silent) setRankingsRefreshing(false);
              }
          };

          useEffect(() => {
              if (!bootDone) return;
              fetchRankings({ silent: true });
              const timer = setInterval(() => {
                  if (document.visibilityState === 'visible') fetchRankings({ silent: true });
              }, RANK_PREFETCH_MS);
              return () => clearInterval(timer);
          }, [bootDone]);

          useEffect(() => {
              if (!modals.leaderboard) return;
              const timer = setInterval(() => fetchRankings({ silent: true }), RANK_OPEN_REFRESH_MS);
              return () => clearInterval(timer);
          }, [modals.leaderboard]);

          const openLeaderboard = () => {
              setModals(prev => ({ ...prev, leaderboard: true }));
              fetchRankings({ silent: !!rankingData, afterSync: true });
          };

          const handleSetTarget = async () => {
              const targetObj = PROBLEM_SETS.find(s => s.id === selectedTargetId);
              if (!targetObj || !authUser) return;

              try {
                  const res = await sendApiRequest({
                      action: 'set_target', ...credOf(authUser),
                      targetId: targetObj.id,
                      targetName: targetObj.name
                  });
                  if (res && res.status === 'success') {
                      setTargetTestInfo({ id: targetObj.id, name: targetObj.name });
                      showToast(`「今回」を【${targetObj.name}】に設定しました！`);
                      fetchRankings({ afterSync: true });
                  } else if (res && res.code === 'auth') {
                      handleAuthExpired();
                  } else {
                      showToast((res && res.message) || "設定に失敗しました");
                  }
              } catch(e) {
                  showToast("設定に失敗しました");
              }
          };

          // ════════════ アンケート ════════════
          const checkAndPromptSurvey = (userObj, setId) => {
              if (!userObj || surveyDoneRef.current[setId]) return;
              const setObj = PROBLEM_SETS.find(s => s.id === setId) || PROBLEM_SETS[0];
              setSurveyModal({ user: userObj, setId: setId, setName: setObj.name });
          };

          const markSurveyDone = (setId) => {
              surveyDoneRef.current = { ...surveyDoneRef.current, [setId]: true };
              schedulePrefsSave();
          };

          const handleSurveySubmit = async (e) => {
              if (e) e.preventDefault();
              if (!surveyScore) {
                  showToast("点数を入力してください");
                  return;
              }
              markSurveyDone(surveyModal.setId);
              try {
                  await sendApiRequest({
                      action: 'survey_score', ...credOf(surveyModal.user),
                      userName: surveyModal.user.name,
                      currentTestName: surveyModal.setName,
                      previousTestName: surveyPrevTest,
                      score: Number(surveyScore)
                  });
                  showToast("ご協力ありがとうございました！");
              } catch(err) {}
              setSurveyScore('');
              setSurveyModal(null);
          };

          const handleSurveySkip = () => {
              markSurveyDone(surveyModal.setId);
              setSurveyModal(null);
          };

          // ════════════ 学習ロジック ════════════
          // ランキング用カウント：問題表示から一定時間たった回答だけを数える（連打対策）
          const addExerciseCount = () => {
              if (!authRef.current) return;
              if (Date.now() - shownAtRef.current < MIN_COUNT_MS) return;
              const sid = currentSetIdRef.current;
              pendingCountRef.current[sid] = (pendingCountRef.current[sid] || 0) + 1;
          };

          const saveItems = (newItems) => {
              setItems(newItems);
              const setId = currentSetIdRef.current;
              const synced = syncedRef.current[setId] || new Map();
              if (!dirtyRef.current[setId]) dirtyRef.current[setId] = new Map();
              const dirty = dirtyRef.current[setId];
              newItems.forEach(item => {
                  const enc = encodeItem(item);
                  const baseEnc = synced.get(item.key) || DEFAULT_ENC;
                  if (enc !== baseEnc) dirty.set(item.key, enc);
                  else dirty.delete(item.key);
              });
          };

          const nextQuestion = (currentItems, mode, explicitIndex = null) => {
              const reverse = settingsRef.current.reverseMode;
              const list = currentItems.filter(i => {
                  const s = getStatusFor(i, reverse);
                  if (mode === 'star') return s.star && !i.sessionDone;
                  if (mode === 'wrong1') return (s.wrongCount || 0) >= 1;
                  if (mode === 'wrong2') return (s.consecutiveWrong || 0) >= 2;
                  return !s.ok;
              });

              if (mode === 'wrong1' || mode === 'wrong2') {
                  if (list.length === 0) {
                      setCurrentItem(null);
                      setIsFinished(false);
                      return;
                  }
                  setIsFinished(false);
                  const nextIdx = explicitIndex !== null ? explicitIndex : (candidateIndex >= list.length ? 0 : candidateIndex);
                  setCandidateIndex(nextIdx);
                  setCurrentItem(list[nextIdx]);
                  shownAtRef.current = Date.now();
                  setIsRevealed(false);
                  clearCanvas();
                  return;
              }

              if (list.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);

              let candidates = list.filter(item => !coolDownQueue.current.includes(item.key));
              if (candidates.length === 0) {
                  candidates = list;
              }

              const shuffled = shuffleArray(candidates);
              const selected = shuffled[0];

              coolDownQueue.current.push(selected.key);
              if (coolDownQueue.current.length > 3) {
                  coolDownQueue.current.shift();
              }

              setCurrentItem(selected);
              shownAtRef.current = Date.now();
              setIsRevealed(false);
              clearCanvas();
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          const displayData = useMemo(() => {
              if (!currentItemDetail) return { q: '', a: '' };
              let q = currentItemDetail.q;
              let a = currentItemDetail.a;
              if (settings.reverseMode) {
                  const match = q.match(/"([^"]+)"/);
                  if (match) {
                      q = q.replace(/"([^"]+)"/, `"${a}"`);
                      a = match[1];
                  } else {
                      const temp = q; q = a; a = temp;
                  }
              }
              return { q, a };
          }, [currentItemDetail, settings.reverseMode]);

          const displayQuestion = displayData.q;
          const displayAnswer = displayData.a;

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed || progressLoading) return;
              setIsRevealed(true);
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, progressLoading, settings, displayAnswer]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = displayAnswer.trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer ||
                  userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              if (settings.autoSpeak) speak(displayAnswer, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings, displayAnswer]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed || progressLoading) return;
              addExerciseCount();

              const isRead = settings.reverseMode;
              const newItems = items.map(item => {
                  if (item.key === currentItemDetail.key) {
                      const cur = isRead ? (item.read || {}) : (item.write || {});
                      const updatedStatus = {
                          ...cur,
                          ok: isOk,
                          star: (activeMode === 'star' && isOk) ? false : cur.star,
                          wrongCount: isOk ? cur.wrongCount : ((cur.wrongCount || 0) + 1),
                          consecutiveWrong: isOk ? 0 : ((cur.consecutiveWrong || 0) + 1),
                          lastWrongTime: isOk ? cur.lastWrongTime : Date.now()
                      };
                      return {
                          ...item,
                          sessionDone: isOk,
                          [isRead ? 'read' : 'write']: updatedStatus
                      };
                  }
                  return item;
              });

              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, progressLoading, items, activeMode, settings.reverseMode]);

          const handleNextOnly = () => {
              if (currentModeCandidates.length === 0 || progressLoading) return;
              addExerciseCount();
              const nextIdx = (candidateIndex + 1) % currentModeCandidates.length;
              nextQuestion(items, activeMode, nextIdx);
          };

          const toggleStar = (id) => {
              if (progressLoading) return;
              const isRead = settings.reverseMode;
              const newItems = items.map(item => {
                  if (item.id === id) {
                      const cur = isRead ? (item.read || {}) : (item.write || {});
                      return {
                          ...item,
                          [isRead ? 'read' : 'write']: { ...cur, star: !cur.star }
                      };
                  }
                  return item;
              });
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) {
                  const s = isRead ? target.read : target.write;
                  showToast(s.star ? "要復習に追加しました" : "要復習から外しました");
              }
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              try {
                  window.speechSynthesis.cancel();
                  const u = new SpeechSynthesisUtterance(text);
                  u.lang = 'ja-JP';
                  u.rate = speechRates[rateIdx]?.value || 1.0;
                  window.speechSynthesis.speak(u);
              } catch(e) {}
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) { showToast('音声認識に対応していません'); return; }
              if (isListening) { recognitionRef.current.stop(); setIsListening(false); }
              else {
                  setDictationResult('');
                  try { recognitionRef.current.start(); setIsListening(true); }
                  catch(e) { showToast('音声認識を開始できません'); }
              }
          };

          const updateSetting = (key, value) => {
              commitSettings({ ...settingsRef.current, [key]: value });
          };

          const applyPreset = (preset) => {
              commitSettings({ ...settingsRef.current, ...preset.settings });
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = {
                  id: `preset_${Date.now()}`,
                  name: presetName.trim(),
                  settings: { ...settingsRef.current }
              };
              commitPresets([...presetsRef.current, newPreset]);
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              commitPresets(presetsRef.current.filter(p => p.id !== id));
              showToast('プリセットを削除しました');
          };

          const startFocusedLearning = () => {
              const filtered = items.filter(i => {
                  const s = getStatus(i);
                  if (listFilter === 'star') return s.star;
                  if (listFilter === 'ng') return !s.ok;
                  if (listFilter === 'ok') return s.ok;
                  return true;
              });
              setModals({ ...modals, list: false });
              setActiveMode(listFilter === 'star' ? 'star' : 'all');
              nextQuestion(shuffleArray(filtered), listFilter === 'star' ? 'star' : 'all');
              showToast("集中学習を開始しました");
          };

          // 問題データの編集（このセッション中のみ有効。進捗は問題文ごとに保持される）
          const applyCustomData = () => {
              setCustomTexts(prev => ({ ...prev, [currentSetId]: tempRawText }));
              setModals(prev => ({ ...prev, edit: false }));
              showToast("問題データを更新しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの問題データに戻しますか？")) {
                  setCustomTexts(prev => {
                      const n = { ...prev };
                      delete n[currentSetId];
                      return n;
                  });
                  setTempRawText(currentSet.data);
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("初期データに戻しました");
              }
          };

          const resetAllData = async () => {
              if (!window.confirm("このテストの学習履歴(進捗・★マーク)を削除して最初からやり直しますか？")) return;
              const sid = currentSetIdRef.current;
              if (authRef.current) {
                  try {
                      const res = await sendApiRequest({ action: 'reset_progress', ...credOf(authRef.current), setId: sid });
                      if (!res || res.status !== 'success') {
                          if (res && res.code === 'auth') handleAuthExpired();
                          else showToast("リセットに失敗しました");
                          return;
                      }
                  } catch(e) {
                      showToast("リセットに失敗しました");
                      return;
                  }
              }
              dirtyRef.current[sid] = new Map();
              syncedRef.current[sid] = new Map();
              const freshItems = parseProblemData(rawText);
              setItems(freshItems);
              setModals(prev => ({ ...prev, menu: false }));
              coolDownQueue.current = [];
              setIsFinished(false);
              nextQuestion(shuffleArray(freshItems), 'all');
              showToast("学習データをリセットしました");
          };

          // ⑪ 「すべて」モード再開処理（★要復習などは消さずにマスターだけリセット）
          const replayAllData = () => {
              const isRead = settings.reverseMode;
              const reset = items.map(item => {
                  const cur = isRead ? (item.read || {}) : (item.write || {});
                  return {
                      ...item,
                      sessionDone: false,
                      [isRead ? 'read' : 'write']: { ...cur, ok: false }
                  };
              });
              saveItems(reset);
              coolDownQueue.current = [];
              setIsFinished(false);
              nextQuestion(shuffleArray(reset), 'all');
          };

          const exportJSON = () => {
              const data = {
                  version: 2,
                  exportedAt: new Date().toISOString(),
                  setId: currentSet.id,
                  setName: currentSet.name,
                  settings: settings,
                  presets: presets,
                  progress: Object.fromEntries(items.map(i => [i.q, { write: i.write, read: i.read }])),
                  customData: rawText
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `${currentSet.name}_backup.json`;
              a.click();
              URL.revokeObjectURL(url);
              showToast('バックアップを保存しました');
          };

          const importJSON = () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json';
              input.onchange = (e) => {
                  const file = e.target.files[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                      try {
                          const data = JSON.parse(ev.target.result);
                          if (!window.confirm("バックアップを読み込みますか？")) return;
                          if (data.settings) commitSettings({ ...DEFAULT_SETTINGS, ...data.settings });
                          if (Array.isArray(data.presets) && data.presets.length > 0) commitPresets(data.presets);
                          if (data.progress) {
                              const merged = items.map(item => {
                                  const h = data.progress[item.q];
                                  return h ? { ...item, write: h.write || item.write, read: h.read || item.read } : item;
                              });
                              saveItems(merged);
                              nextQuestion(merged, activeModeRef.current);
                          }
                          if (data.customData && data.setId === currentSetId && data.customData !== currentSet.data) {
                              setCustomTexts(prev => ({ ...prev, [currentSetId]: data.customData }));
                          }
                          showToast('読み込みました');
                      } catch(err) {
                          showToast('JSONの解析に失敗しました');
                      }
                  };
                  reader.readAsText(file);
              };
              input.click();
          };

          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');

              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              let pressure = (e.touches && e.touches[0].force) ? e.touches[0].force : (e.pressure || 0.5);

              const rect = canvas.getBoundingClientRect();
              const x = (clientX - rect.left) * (canvas.width / rect.width);
              const y = (clientY - rect.top) * (canvas.height / rect.height);

              const now = Date.now();
              const dt = now - lastTime.current;
              const dist = Math.hypot(x - lastX.current, y - lastY.current);
              let speed = Math.min(dist / (dt || 1), 5);

              let targetWidth = 4.5;
              if (e.pointerType === 'pen' || e.touches) targetWidth = 1.5 + (pressure * 8.5);
              else targetWidth = 6.8 - (speed * 1.0);

              currentStrokeWidth.current = Math.max(1.5, Math.min(10.0, currentStrokeWidth.current * 0.72 + targetWidth * 0.28));

              ctx.lineWidth = currentStrokeWidth.current;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              ctx.beginPath();
              ctx.moveTo(lastX.current, lastY.current);
              ctx.lineTo(x, y);
              ctx.stroke();

              lastX.current = x; lastY.current = y; lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas;
              isDrawing.current = true;

              let clientX = e.touches ? e.touches[0].clientX : e.clientX;
              let clientY = e.touches ? e.touches[0].clientY : e.clientY;
              const rect = canvas.getBoundingClientRect();
              lastX.current = (clientX - rect.left) * (canvas.width / rect.width);
              lastY.current = (clientY - rect.top) * (canvas.height / rect.height);
              lastTime.current = Date.now();
              currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => { if (e) e.preventDefault(); isDrawing.current = false; };

          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2; canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };

              if (settings.showCanvas) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition !== 'overlay') setupCanvas(canvasRightRef.current);
                  }, 80);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale, currentSetId, progressLoading]);

          useEffect(() => {
              const handleKeyDown = (e) => {
                  const tag = (e.target && e.target.tagName) || '';

                  if (modals.menu || modals.list || modals.edit || modals.leaderboard || surveyModal || isFinished) return;
                  if (showLoginPopup && !authUser) return;
                  if (progressLoading) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                  if (!isRevealed) {
                      if (settings.enableInput && e.code === 'Enter') { e.preventDefault(); handleInputSubmit(); }
                      else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); handleReveal(); }
                  } else {
                      if (activeMode === 'wrong1' || activeMode === 'wrong2') {
                          if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleNextOnly(); }
                      } else {
                          if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                          else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }

              };
              window.addEventListener('keydown', handleKeyDown);

          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit, displayAnswer, activeMode, surveyModal, showLoginPopup, authUser, progressLoading, items, candidateIndex]);

                                              <label className="relative inline-flex items-center cursor-pointer shrink-0 mt-1">
                                                  <input type="checkbox" className="sr-only peer" checked={settings.darkMode} onChange={(e) => updateSetting('darkMode', e.target.checked)} />
                                                  <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                                              </label>
                                          </div>
                                      </div>
                                  )}

                                  {activeTab === 'preset' && (
                                      <div className="space-y-5 animate-in fade-in duration-150">
                                          <div className="space-y-2">
                                              <span className="font-bold text-xs text-slate-500 dark:text-slate-400">プリセット一覧</span>
                                              <div className="grid grid-cols-1 gap-2">
                                                  {presets.map(preset => (
                                                      <button key={preset.id} onClick={() => applyPreset(preset)} className="flex items-center justify-between p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/40 hover:bg-blue-50 dark:hover:bg-blue-950/20 border border-slate-100 dark:border-slate-700/60 transition-colors group text-left">
                                                          <div className="flex items-center gap-3">
                                                              <IconBookOpen size={18} className="text-blue-600 dark:text-blue-400 group-hover:scale-105 transition-transform" />
                                                              <div>
                                                                  <div className="text-sm font-bold text-slate-700 dark:text-slate-200">{preset.name}</div>
                                                              </div>
                                                          </div>
                                                      </button>
                                                  ))}
                                              </div>
                                          </div>
                                      </div>
                                  )}

                                  {activeTab === 'data' && (
                                      <div className="space-y-4 animate-in fade-in duration-150">
                                          <div className="grid grid-cols-2 gap-3">
                                              <button onClick={() => { setModals({ ...modals, menu: false, list: true }); setListFilter('all'); }} className="flex flex-col items-center justify-center p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/40 hover:bg-blue-50 dark:hover:bg-blue-950/20 border border-slate-100 dark:border-slate-700/60 transition-colors">
                                                  <IconList size={22} className="text-blue-600 mb-1.5" />
                                                  <span className="text-xs font-bold">問題リスト表示</span>
                                              </button>
                                              <button onClick={() => { setModals({ ...modals, menu: false, edit: true }); setTempRawText(rawText); }} className="flex flex-col items-center justify-center p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/40 hover:bg-blue-50 dark:hover:bg-blue-950/20 border border-slate-100 dark:border-slate-700/60 transition-colors">
                                                  <IconEdit size={22} className="text-blue-600 mb-1.5" />
                                                  <span className="text-xs font-bold">問題データ編集</span>
                                              </button>
                                          </div>
                                          <div className="border-t border-slate-100 dark:border-slate-700 pt-4 space-y-2">
                                              <div className="flex items-center gap-2 mb-1">
                                                  <IconFolderOpen size={16} className="text-blue-600" />
                                                  <span className="font-bold text-sm text-blue-700 dark:text-blue-400">保存と読込</span>
                                              </div>
                                              <p className="text-xs text-slate-400 dark:text-slate-500 leading-normal">
                                                  {authUser ? '進捗は自動でクラウドに保存されています。ファイルのバックアップは任意です。' : 'ログインすると進捗が自動で保存されます。'}
                                              </p>
                                              <div className="grid grid-cols-2 gap-2">
                                                  <button onClick={exportJSON} className="py-2.5 flex items-center justify-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-xl border border-emerald-200 text-xs"><IconSave size={14} /> エクスポート</button>
                                                  <button onClick={importJSON} className="py-2.5 flex items-center justify-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl border border-blue-200 text-xs"><IconFolderOpen size={14} /> インポート</button>
                                              </div>
                                          </div>
                                          <div className="pt-4 border-t border-slate-100 dark:border-slate-700/60">
                                              <button onClick={resetAllData} className="w-full py-3 flex items-center justify-center gap-2 text-rose-500 font-bold rounded-xl bg-rose-50/50 hover:bg-rose-100/50 transition-colors text-xs">
                                                  <IconRotateCcw size={18} /> 学習進捗をリセット
                                              </button>
                                          </div>
                                      </div>
                                  )}
                              </div>

                              <div className="p-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-100 dark:border-slate-700 flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, menu: false})} className="py-2.5 px-6 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition-all">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 問題リストモーダル */}
                  {modals.list && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, list: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-2xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <h3 className="text-lg font-bold">問題リスト</h3>
                                  <button onClick={() => setModals({...modals, list: false, menu: true})} className="p-1 text-slate-400 hover:text-slate-600"><IconX size={24} /></button>
                              </div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                                  {items.map(item => (
                                      <div key={item.key} className="flex gap-4 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/30 dark:bg-slate-800/40">
                                          <div className="flex flex-col gap-3 items-center shrink-0">
                                              {getStatus(item).ok ? <IconCheckCircle size={20} className="text-emerald-500" /> : <div className="w-5 h-5 rounded-full border-2 border-slate-200 dark:border-slate-700" />}
                                              <button onClick={() => toggleStar(item.id)}>
                                                  <IconStar size={20} className={getStatus(item).star ? "text-amber-400" : "text-slate-300"} fill={getStatus(item).star ? "currentColor" : "none"} />
                                              </button>
                                          </div>
                                          <div>
                                              <div className="font-bold mb-1 leading-snug">{item.q}</div>
                                              <div className="text-sm font-serif text-blue-700 dark:text-blue-400 font-bold">{item.a}</div>
                                          </div>
                                      </div>
                                  ))}
                              </div>
                              <div className="p-4 bg-slate-50 dark:bg-slate-900 border-t flex justify-end shrink-0">
                                  <button onClick={() => setModals({...modals, list: false})} className="py-2.5 px-6 bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-xl">閉じる</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 問題データ編集モーダル */}
                  {modals.edit && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                  <h3 className="text-lg font-bold">問題データの編集</h3>
                                  <button onClick={() => setModals({...modals, edit: false, menu: true})} className="p-1 text-slate-400"><IconX size={24} /></button>
                              </div>
                              <div className="flex-1 p-4 flex flex-col gap-3 min-h-0">
                                  <p className="text-[11px] text-slate-400 dark:text-slate-500 leading-normal">※ 編集内容はこの画面を開いている間のみ有効です（再読み込みで元に戻ります）。</p>
                                  <textarea
                                      value={tempRawText}
                                      onChange={(e) => setTempRawText(e.target.value)}
                                      className="flex-1 w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-sm resize-none"
                                      placeholder="問題 [タブまたはスペース] 答え"
                                  />
                              </div>
                              <div className="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex gap-3 shrink-0">
                                  <button onClick={resetToDefaultData} className="px-4 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-bold">初期化</button>
                                  <button onClick={() => setModals({...modals, edit: false, menu: true})} className="px-4 py-3 bg-slate-100 dark:bg-slate-700 rounded-xl text-sm font-bold">戻る</button>
                                  <button onClick={applyCustomData} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">適用</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* アンケートポップアップ */}
                  {surveyModal && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in">
                          <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl shadow-2xl p-6 border border-slate-100 dark:border-slate-700 space-y-4">
                              <div className="text-center">
                                  <div className="w-12 h-12 bg-blue-100 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-2">
                                      <IconTrophy size={24} />
                                  </div>
                                  <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">前回のテスト結果を教えてね！</h3>
                                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                                      漢字の伸びを調べるため、前回の点数を教えてください。（任意・スキップできます）
                                  </p>
                              </div>
                              <form onSubmit={handleSurveySubmit} className="space-y-3">
                                  <div>
                                      <label className="text-[10px] font-bold text-slate-400 block mb-1">前回のテストはどれ？</label>
                                      <select
                                          value={surveyPrevTest}
                                          onChange={(e) => setSurveyPrevTest(e.target.value)}
                                          className="w-full px-3 py-2 rounded-xl border text-xs font-bold bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 focus:outline-none"
                                      >
                                          {PROBLEM_SETS.map(s => (
                                              <option key={s.id} value={s.name}>{s.name}</option>
                                          ))}
                                          <option value="その他">その他のテスト</option>
                                      </select>
                                  </div>
                                  <div>
                                      <label className="text-[10px] font-bold text-slate-400 block mb-1">何点だった？</label>
                                      <input
                                          type="number"
                                          min="0"
                                          max="100"
                                          placeholder="例: 85 (0〜100点)"
                                          value={surveyScore}
                                          onChange={(e) => setSurveyScore(e.target.value)}
                                          className="w-full px-3 py-2 rounded-xl border text-xs font-bold bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 focus:outline-none"
                                          autoFocus
                                      />
                                  </div>
                                  <div className="space-y-2 pt-2">
                                      <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs shadow-md transition-all">
                                          送信して学習を始める
                                      </button>
                                      <button type="button" onClick={handleSurveySkip} className="w-full py-2 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 font-bold rounded-xl text-xs">
                                          今は答えない (スキップ)
                                      </button>
                                  </div>
                              </form>
                          </div>
                      </div>
                  )}

                  {/* トースト通知 */}
                  <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-[70] ${toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                      {toast.message}
                  </div>

              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
